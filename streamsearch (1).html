<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vid Search</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================
     STREAMING URL BASE — change this if the site moves
     ============================================ */
  :root {
    --accent: #e5383b;
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: 0.05em;
    color: var(--text);
    line-height: 1;
    margin-bottom: 0.2em;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }

  .search-row {
    display: flex;
    gap: 0.75rem;
    width: 100%;
    max-width: 560px;
    margin-bottom: 2rem;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    padding: 0.85rem 1.2rem;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  button#searchBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    padding: 0 1.6rem;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  button#searchBtn:hover { opacity: 0.85; }

  #results {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.6rem 1rem 0.6rem 0.6rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    transition: border-color 0.2s;
  }

  .result-card:hover { border-color: var(--accent); }

  .result-poster {
    width: 48px;
    height: 72px;
    object-fit: cover;
    border-radius: 3px;
    background: var(--border);
    flex-shrink: 0;
  }

  .no-poster {
    width: 48px;
    height: 72px;
    border-radius: 3px;
    background: var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  .result-info { flex: 1; }

  .result-title {
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 0.2rem;
  }

  .result-meta {
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .stream-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    padding: 0.4rem 1rem;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
  }

  .stream-btn:hover { background: var(--accent); color: #fff; }

  #status {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.5rem;
    min-height: 1.2em;
  }
</style>
</head>
<body>

<h1>VID<span>SEARCH</span></h1>
<p class="subtitle">Find it. Watch it.</p>

<div class="search-row">
  <input type="text" id="query" placeholder="Film or show name..." autofocus>
  <button id="searchBtn">Search</button>
</div>

<div id="status"></div>
<div id="results"></div>

<script>
  // ============================================
  // TMDB API KEY
  // ============================================
  const TMDB_API_KEY = '9c2f0a71e20cf0f5c14709ed2d1ec9e0';

  // ============================================
  // STREAMING URL BASE — edit this line if the site moves
  // ============================================
  const STREAM_BASE = 'https://vidsrcme.ru/embed/';

  const queryInput = document.getElementById('query');
  const searchBtn  = document.getElementById('searchBtn');
  const resultsDiv = document.getElementById('results');
  const statusDiv  = document.getElementById('status');

  searchBtn.addEventListener('click', doSearch);
  queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  async function doSearch() {
    const query = queryInput.value.trim();
    if (!query) return;

    resultsDiv.innerHTML = '';
    statusDiv.textContent = 'Searching...';

    try {
      const res = await fetch(
        `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&page=1`
      );
      const data = await res.json();

      // Filter to only movies and TV shows, take top 5
      const results = (data.results || [])
        .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
        .slice(0, 5);

      if (results.length === 0) {
        statusDiv.textContent = 'No results found.';
        return;
      }

      statusDiv.textContent = `${results.length} result${results.length > 1 ? 's' : ''} — pick one:`;
      results.forEach(item => renderCard(item));

    } catch (err) {
      statusDiv.textContent = 'Something went wrong. Check your connection.';
    }
  }

  function renderCard(item) {
    const isMovie = item.media_type === 'movie';
    const title   = isMovie ? item.title : item.name;
    const year    = isMovie
      ? (item.release_date || '').slice(0, 4)
      : (item.first_air_date || '').slice(0, 4);
    const type    = isMovie ? 'Movie' : 'TV Series';
    const poster  = item.poster_path
      ? `<img class="result-poster" src="https://image.tmdb.org/t/p/w92${item.poster_path}" alt="${title}">`
      : `<div class="no-poster">🎬</div>`;

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      ${poster}
      <div class="result-info">
        <div class="result-title">${title}</div>
        <div class="result-meta">${type}${year ? ' · ' + year : ''}</div>
      </div>
      <button class="stream-btn">Stream</button>
    `;

    card.querySelector('.stream-btn').addEventListener('click', () => openStream(item, isMovie));
    resultsDiv.appendChild(card);
  }

  async function openStream(item, isMovie) {
    statusDiv.textContent = 'Fetching IMDB ID...';

    try {
      const endpoint = isMovie
        ? `https://api.themoviedb.org/3/movie/${item.id}/external_ids?api_key=${TMDB_API_KEY}`
        : `https://api.themoviedb.org/3/tv/${item.id}/external_ids?api_key=${TMDB_API_KEY}`;

      const res  = await fetch(endpoint);
      const data = await res.json();
      const imdbId = data.imdb_id;

      if (!imdbId) {
        statusDiv.textContent = 'No IMDB ID found for this title.';
        return;
      }

      const url = STREAM_BASE + imdbId;
      statusDiv.textContent = '';
      window.open(url, '_blank');

    } catch (err) {
      statusDiv.textContent = 'Failed to get IMDB ID. Try again.';
    }
  }
</script>
</body>
</html>
