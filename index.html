<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vid Search</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #e5383b;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: 0.05em;
    color: var(--text);
    line-height: 1;
    margin-bottom: 0.2em;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }

  .search-row {
    display: flex;
    gap: 0.75rem;
    width: 100%;
    max-width: 560px;
    margin-bottom: 2rem;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    padding: 0.85rem 1.2rem;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  button#searchBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    padding: 0 1.6rem;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  button#searchBtn:hover { opacity: 0.85; }

  #results {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .result-card:hover { border-color: var(--accent); }

  .card-main {
    padding: 0.6rem 1rem 0.6rem 0.6rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .result-poster {
    width: 48px;
    height: 72px;
    object-fit: cover;
    border-radius: 3px;
    background: var(--border);
    flex-shrink: 0;
  }

  .no-poster {
    width: 48px;
    height: 72px;
    border-radius: 3px;
    background: var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  .result-info { flex: 1; }

  .result-title {
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 0.2rem;
  }

    font-size: 0.78rem;
