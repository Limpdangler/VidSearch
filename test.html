        <button id="editCancel" class="src-btn">Cancel</button>
        <button id="editDelete" class="src-btn danger">Delete profile</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ============================================
  // TMDB API KEY
  // ============================================
  const TMDB_API_KEY = '9c2f0a71e20cf0f5c14709ed2d1ec9e0';

  // ============================================
  // STREAMING URL BASE
  // Domain is auto-fetched from vidsrc.domains on each page load.
  // Falls back to vidsrc.sh if that fetch fails or is blocked.
  // If the path format ever changes, update /embed/movie/ and /embed/tv/ below.
  // ============================================
  let STREAM_MOVIE = 'https://vidsrc.sh/embed/movie/';
  let STREAM_TV    = 'https://vidsrc.sh/embed/tv/';

  // ============================================
  // VIDEO SOURCES
  // Each source says: how to build its player address, how to read the messages
  // its player sends, and (if it supports it) how to tell it to jump / play.
  // Every reading is turned into the same shape: { status, pos, dur, season, episode }
  // ============================================
  const num = v => (v == null || v === '' || !isFinite(Number(v))) ? null : Number(v);

  const SOURCES = {
    vidsrc: {
      name: 'vidsrc',
      url(info, startAt, autoplay) {
        let url = info.isMovie
          ? STREAM_MOVIE + info.imdbId
          : `${STREAM_TV}${info.imdbId}/${info.season}/${info.episode}`;
        const p = [];
        if (startAt > 0) p.push(`startAt=${startAt}`, `progress=${startAt}`);
        p.push(`autoplay=${autoplay ? 1 : 0}`, `autoPlay=${autoplay}`);
        return url + '?' + p.join('&');
      },
      // { type: "PLAYER_EVENT", data: { player_status, player_progress, player_duration, player_info } }
      read(msg) {
        if (msg.type !== 'PLAYER_EVENT' || !msg.data) return null;
        const d = msg.data, pi = d.player_info || {};
        return {
          status: String(d.player_status || '').toLowerCase(),
          pos: num(d.player_progress), dur: num(d.player_duration),
          season: num(pi.season), episode: num(pi.episode)
        };
      }
      // no controls
    },

    vidrift: {
      name: 'VidRift',
      url(info, startAt, autoplay) {
        // VidRift takes TMDB ids. It auto-plays (muted) unless autoplay=0.
        // It has no start-time setting in the address: we send it a "resume" message instead.
        // hide= removes buttons from its control bar (they crowd/overlap on phones): lock, cast,
        // episodes (overlaps the time when the player is wide; Vid Search has its own drop-downs).
        // fs=parent: its fullscreen button asks Vid Search to go fullscreen instead (our fullscreen
        // keeps its tidy layout and the Up next box). We deliberately don't tell it it's fullscreen,
        // because its own fullscreen layout is the one where the text overlaps.
        let url = info.isMovie
          ? `https://embed.vidrift.net/embed/movie/${info.tmdbId}`
          : `https://embed.vidrift.net/embed/tv/${info.tmdbId}/${info.season}/${info.episode}`;
        const p = ['hide=lock,cast,episodes', 'fs=parent'];
        if (!autoplay) p.push('autoplay=0');
        return url + '?' + p.join('&');
      },
      startAtByMessage: true,
      builtInSkip: true, // has its own Skip intro button, so ours stays hidden
      // Messages: vidrift:progress (currentTime, duration), vidrift:paused / unpaused, vidrift:ended, vidrift:episode
      read(msg) {
        const type = String(msg.type || '');
        if (!type.startsWith('vidrift:')) return null;
        const d = (msg.data && typeof msg.data === 'object') ? { ...msg, ...msg.data } : msg;
        const ev = type.slice(8);
        if (ev === 'fullscreen') return { fullscreenRequest: true }; // its fullscreen button was pressed
        const map = { progress: 'playing', unpaused: 'playing', paused: 'paused', ended: 'ended' };
        const pos = num(d.currentTime), dur = num(d.duration);
        return {
          status: map[ev] || ev,
          pos: ev === 'ended' && pos == null ? dur : pos, dur,
          season: num(d.season), episode: num(d.episode),
          episodeChange: ev === 'episode'
        };
      },
      seek(t) { sendToPlayer({ type: 'vidrift:resume', currentTime: t }); },
      resume() { sendToPlayer({ type: 'vidrift:play' }); },
      pause() { sendToPlayer({ type: 'vidrift:pause' }); }
    },
    vidnest: {
      name: 'VidNest',
      url(info, startAt, autoplay) {
        // VidNest takes TMDB ids. t = start time in seconds, autoplay=1 starts by itself.
        let url = info.isMovie
          ? `https://vidnest.pro/movie/${info.tmdbId}`
          : `https://vidnest.pro/tv/${info.tmdbId}/${info.season}/${info.episode}`;
        const p = [`autoplay=${autoplay ? 1 : 0}`];
        if (startAt > 0) p.push(`t=${startAt}`);
        return url + '?' + p.join('&');
      },
      // Messages are tagged source: 'vidnest-player'; events play/pause/seeked/ended/timeupdate,
      // with currentTime + duration; 'episodechange' has season + episode.
      read(msg) {
        if (msg.source !== 'vidnest-player') return null;
        const d = (msg.data && typeof msg.data === 'object') ? { ...msg, ...msg.data } : msg;
        const ev = String(d.event || d.type || d.action || d.name || '').toLowerCase();
        const map = { play: 'playing', playing: 'playing', timeupdate: 'playing', pause: 'paused',
                      paused: 'paused', seeked: 'seeked', ended: 'ended', playerstatus: d.paused ? 'paused' : 'playing' };
        return {
          status: map[ev] || ev,
          pos: num(d.currentTime ?? d.time), dur: num(d.duration),
          season: num(d.season), episode: num(d.episode),
          episodeChange: ev === 'episodechange'
        };
      },
      seek(t) { sendToPlayer({ action: 'seek', time: t }); },
      resume() { sendToPlayer({ action: 'play' }); },
      pause() { sendToPlayer({ action: 'pause' }); }
    }
  };

  const DEFAULT_SOURCE = 'vidsrc';

  function getSourceKey() {
    try {
      const k = localStorage.getItem('vs_source');
      if (k && SOURCES[k]) return k;
    } catch {}
    return DEFAULT_SOURCE;
  }

  function setSourceKey(k) {
    try { localStorage.setItem('vs_source', k); } catch {}
  }

  // Send a command into the player (only to the site we loaded)
  function sendToPlayer(msg) {
    try {
      const origin = new URL(document.getElementById('playerFrame').src).origin;
      document.getElementById('playerFrame').contentWindow.postMessage(msg, origin);
    } catch {}
  }

  // Resolves when domain check is done (or failed) — openStream waits on this
  const domainReady = (async function autoUpdateDomain() {
    try {
      const res = await Promise.race([
        fetch('https://vidsrc.domains/'),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4000))
      ]);
      const html = await res.text();
      // Look for the PRIMARY domain — try both orderings in the markup
      const match = html.match(/([a-z0-9][-a-z0-9]*\.[a-z]{2,6})[^<]{0,80}PRIMARY/i)
                 || html.match(/PRIMARY[^<]{0,80}?([a-z0-9][-a-z0-9]*\.[a-z]{2,6})/i);
      if (match) {
        const domain = match[1].toLowerCase();
        STREAM_MOVIE = `https://${domain}/embed/movie/`;
        STREAM_TV    = `https://${domain}/embed/tv/`;
      }
    } catch {
      // CORS blocked or timeout — keep hardcoded fallback above
    }
  })();

  const queryInput  = document.getElementById('query');
  const searchBtn   = document.getElementById('searchBtn');
  const resultsDiv  = document.getElementById('results');
  const statusDiv   = document.getElementById('status');
  const continueDiv = document.getElementById('continue');

  // ── TV layout ───────────────────────────────────────────────
  // Switches on by itself on a Fire Stick / TV (the app says so, and Fire TV's browser
  // names the device "AFT…"). The "TV layout" button can force it on or off.
  const TV_AUTO = /VidSearchTV|\bAFT[A-Z]|Android ?TV|GoogleTV|BRAVIA|SMART-?TV/i.test(navigator.userAgent);
  function tvSetting() {
    try { return localStorage.getItem('vs_tv') || 'auto'; } catch { return 'auto'; }   // auto | on | off
  }
  function isTvLayout() {
    const s = tvSetting();
    return s === 'on' || (s === 'auto' && TV_AUTO);
  }

  // Small helper so show titles can't break the page layout
  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ── Progress memory (localStorage) ──────────────────────────
  // Each show is saved as:
  // { season, episode, title, poster, tmdbId, t, pos (seconds in), dur (episode length) }
  function getProgress(imdbId) {
    try {
      const raw = localStorage.getItem('vs_progress_' + imdbId);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }

  // "Watched" ticks: each show's record also keeps a list of the episodes you've
  // finished, as "season x episode" (e.g. "2x5")
  function watchedKey(season, episode) { return season + 'x' + episode; }
  function watchedSet(rec) { return new Set((rec && Array.isArray(rec.w)) ? rec.w : []); }
  function isWatched(rec, season, episode) {
    if (!rec) return false;
    if (watchedSet(rec).has(watchedKey(season, episode))) return true;
    // Saved before ticks existed: the episode you last finished still counts
    return rec.season === season && rec.episode === episode && isFinished(rec);
  }

  function saveProgress(imdbId, info) {
    const old = getProgress(imdbId);
    const rec = {
      season:  info.season,
      episode: info.episode,
      title:   info.title,
      poster:  info.poster || null,
      tmdbId:  info.tmdbId,
      isMovie: !!info.isMovie,
      t:       Date.now(),
      pos:     info.pos || 0,
      dur:     info.dur || 0
    };
    let w = (old && Array.isArray(old.w)) ? old.w.slice() : [];
    if (!rec.isMovie && rec.season != null && isFinished(rec)) {
      const k = watchedKey(rec.season, rec.episode);
      if (!w.includes(k)) w.push(k);
    }
    if (w.length > 400) w = w.slice(-400);
    if (w.length) rec.w = w;
    try {
      localStorage.setItem('vs_progress_' + imdbId, JSON.stringify(rec));
    } catch {}
    if (typeof scheduleSync === 'function') scheduleSync();
  }

  // "Finished" = within the last 5% (end credits)
  // Finished = 95% of the way through, or into the last 90 seconds (the end credits)
  function isFinished(p) {
    return !!(p && p.dur > 0 && (p.pos / p.dur > 0.95 || (p.dur > 600 && p.dur - p.pos < 90)));
  }

  // How far through, 0–100 (0 if the length isn't known yet)
  function percent(p) {
    if (!p || !(p.dur > 0)) return 0;
    return Math.max(0, Math.min(100, Math.round(p.pos / p.dur * 100)));
  }

  // Where to start: the saved spot if it's the same episode (or the film) and not finished.
  // Films have no season/episode, so both sides are null and still match.
  function resumePoint(saved, season, episode) {
    if (!saved) return 0;
    if ((saved.season ?? null) !== (season ?? null)) return 0;
    if ((saved.episode ?? null) !== (episode ?? null)) return 0;
    if (isFinished(saved)) return 0;
    return saved.pos > 10 ? Math.floor(saved.pos) : 0;
  }

  function removeProgress(imdbId) {
    try { localStorage.removeItem('vs_progress_' + imdbId); } catch {}
    // Remember the removal so it syncs to your other devices too
    const removed = getRemoved();
    removed[imdbId] = Date.now();
    setRemoved(removed);
    if (typeof scheduleSync === 'function') scheduleSync(1000);
  }

  function getRemoved() {
    try { return JSON.parse(localStorage.getItem('vs_removed') || '{}') || {}; } catch { return {}; }
  }

  function setRemoved(obj) {
    try { localStorage.setItem('vs_removed', JSON.stringify(obj)); } catch {}
  }

  // All saved shows, most recently watched first
  function getAllProgress() {
    const list = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith('vs_progress_')) continue;
        try {
          const data = JSON.parse(localStorage.getItem(key));
          // Skip very old saves (no title), and films you've finished — nothing left to continue
          if (data && data.title && data.tmdbId && !(data.isMovie && isFinished(data))) {
            list.push({ ...data, imdbId: key.slice('vs_progress_'.length) });
          }
        } catch {}
      }
    } catch {}
    return list.sort((a, b) => (b.t || 0) - (a.t || 0)).slice(0, 10);
  }

  // ── Continue watching row ───────────────────────────────────
  function renderContinue() {
    const list = getAllProgress();
    continueDiv.innerHTML = '';
    if (!list.length) {
      if (document.body.classList.contains('tv')) {
        continueDiv.innerHTML = '<div class="section-label">Continue watching</div><div class="tv-empty">Nothing yet. Things you watch appear here.</div>';
      }
      return;
    }

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = 'Continue watching';
    continueDiv.appendChild(label);

    list.forEach(show => {
      const card = document.createElement('div');
      card.className = 'result-card';
      const poster = show.poster
        ? `<img class="result-poster" src="https://image.tmdb.org/t/p/w92${esc(show.poster)}" alt="">`
        : `<div class="no-poster">🎬</div>`;

      const finished = isFinished(show);
      const pct      = finished ? 100 : percent(show);
      let metaText = show.isMovie ? 'Movie' : `S${show.season}E${show.episode}`;
      if (finished)     metaText += ' · watched';
      else if (pct > 0) metaText += ` · ${pct}%`;

      card.innerHTML = `
        <div class="card-main">
          ${poster}
          <div class="result-info">
            <div class="result-title">${esc(show.title)}</div>
            <div class="result-meta">${metaText}</div>
          </div>
          <button class="stream-btn">${finished ? 'Next ep' : 'Resume'}</button>
          <button class="remove-btn" title="Remove from list">✕</button>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;

      card.querySelectorAll('.result-poster, .no-poster, .result-info').forEach(el => {
        el.style.cursor = 'pointer';
        el.addEventListener('click', () => openDetails(show.tmdbId, !!show.isMovie));
      });

      card.querySelector('.stream-btn').addEventListener('click', async () => {
        await domainReady;
        const base = {
          tmdbId: show.tmdbId, imdbId: show.imdbId, title: show.title,
          poster: show.poster, isMovie: !!show.isMovie
        };

        if (finished && !show.isMovie) {
          // Last episode was watched to the end — go straight to the one after it
          const seasons = await getSeasons(show.tmdbId);
          const next = neighbour(seasons, show.season, show.episode, 1);
          if (next) { play({ ...base, ...next, startAt: 0 }); return; }
        }

        play({
          ...base, season: show.season, episode: show.episode,
          startAt: resumePoint(show, show.season, show.episode)
        });
      });

      card.querySelector('.remove-btn').addEventListener('click', () => {
        removeProgress(show.imdbId);
        renderContinue();
      });

      // Finished the last episode you watched: offer the next one, and say if it's new
      if (finished && !show.isMovie) {
        showSummary(show.tmdbId).then(sum => {
          if (!card.isConnected) return;
          const meta = card.querySelector('.result-meta');
          const btn  = card.querySelector('.stream-btn');
          const fill = card.querySelector('.progress-fill');
          const next = neighbour(sum.seasons, show.season, show.episode, 1);
          if (next) {
            const isNew = sum.lastAir && Date.parse(sum.lastAir + 'T00:00:00Z') > (show.t || 0);
            meta.innerHTML = `${isNew ? '<span class="new-badge">New episode</span>' : ''}Up next: S${next.season} E${next.episode}`;
            btn.textContent = 'Play';
            if (fill) fill.style.width = '0%';
          } else {
            meta.textContent = `S${show.season}E${show.episode} · all caught up`;
            btn.textContent = 'Watch again';
          }
        }).catch(() => {});
      }

      continueDiv.appendChild(card);
    });
  }

  // ── TMDB helper ─────────────────────────────────────────────
  async function tmdb(path, extra = '') {
    const res = await fetch(`https://api.themoviedb.org/3/${path}?api_key=${TMDB_API_KEY}${extra}`);
    if (!res.ok) throw new Error('TMDB error ' + res.status);
    return res.json();
  }

  // Turns TMDB's show info into [{ n: seasonNumber, count: episodeCount }],
  // leaving out episodes that haven't aired yet (they wouldn't play anyway).
  function parseSeasons(data) {
    let seasons = (data.seasons || [])
      .filter(s => s.season_number > 0 && s.episode_count > 0)
      .map(s => ({ n: s.season_number, count: s.episode_count }));

    const last = data.last_episode_to_air;
    if (last && last.season_number > 0) {
      seasons = seasons
        .filter(s => s.n <= last.season_number)
        .map(s => s.n === last.season_number
          ? { n: s.n, count: Math.min(s.count, last.episode_number) }
          : s);
    }
    return seasons;
  }

  // One request per show gets both the seasons and the IMDB ID.
  // Remembered for the session, so the player and search cards share it.
  const showCache = {};

  function getShow(tmdbId) {
    if (!showCache[tmdbId]) {
      showCache[tmdbId] = tmdb(`tv/${tmdbId}`, '&append_to_response=external_ids')
        .then(data => ({
          seasons: parseSeasons(data),
          imdbId:  (data.external_ids && data.external_ids.imdb_id) || null
        }))
        .catch(err => { delete showCache[tmdbId]; throw err; }); // allow a retry later
    }
    return showCache[tmdbId];
  }

  // What Continue watching needs to know about a show: its seasons, and when its latest
  // episode came out. Saved on the device for 3 hours (one small request per show).
  const SUMMARY_KEEP = 3 * 3600 * 1000;
  async function showSummary(tmdbId) {
    const key = 'vs_show_' + tmdbId;
    try {
      const c = JSON.parse(localStorage.getItem(key) || 'null');
      if (c && Date.now() - c.at < SUMMARY_KEEP && Array.isArray(c.seasons)) return c;
    } catch {}
    const data = await tmdb(`tv/${tmdbId}`, '&append_to_response=external_ids');
    const sum = {
      at: Date.now(),
      seasons: parseSeasons(data),
      lastAir: (data.last_episode_to_air && data.last_episode_to_air.air_date) || null
    };
    if (!showCache[tmdbId]) {
      showCache[tmdbId] = Promise.resolve({ seasons: sum.seasons, imdbId: (data.external_ids && data.external_ids.imdb_id) || null });
    }
    try { localStorage.setItem(key, JSON.stringify(sum)); } catch {}
    return sum;
  }

  async function getSeasons(tmdbId) {
    try { return (await getShow(tmdbId)).seasons; }
    catch { return []; }
  }

  // Works out the episode after (dir = 1) or before (dir = -1) the current one,
  // rolling over between seasons. Returns null if there isn't one.
  function neighbour(seasons, season, episode, dir) {
    const idx = seasons.findIndex(s => s.n === season);
    if (idx === -1) return null;
    if (dir === 1) {
      if (episode < seasons[idx].count) return { season, episode: episode + 1 };
      if (idx + 1 < seasons.length)     return { season: seasons[idx + 1].n, episode: 1 };
    } else {
      if (episode > 1) return { season, episode: episode - 1 };
      if (idx > 0)     return { season: seasons[idx - 1].n, episode: seasons[idx - 1].count };
    }
    return null;
  }

  // ── Player ──────────────────────────────────────────────────
  const playerEl    = document.getElementById('player');
  const playerFrame = document.getElementById('playerFrame');
  const prevBtn     = document.getElementById('prevBtn');
  const nextBtn     = document.getElementById('nextBtn');
  const closeBtn    = document.getElementById('closeBtn');  const npTitle     = document.getElementById('npTitle');
  const npEp        = document.getElementById('npEp');
  const sourceBtns  = document.getElementById('sourceBtns');


  // Source buttons under the player. Switching reloads the same thing from the new
  // source, at the point you were at.
  function renderSourceBtns() {
    const active = getSourceKey();
    sourceBtns.innerHTML = '';
    Object.entries(SOURCES).forEach(([key, s]) => {
      const b = document.createElement('button');
      b.className = 'src-btn' + (key === active ? ' active' : '');
      b.textContent = s.name;
      b.addEventListener('click', async () => {
        if (key === getSourceKey()) return;
        setSourceKey(key);
        if (current) {
          await domainReady;
          play({ ...current, startAt: Math.floor(estimatedPos()), autoplay: true });
        } else {
          renderSourceBtns();
        }
      });
      sourceBtns.appendChild(b);
    });
    renderPopupBtn();
  }

  // ── Pop-up blocker ──────────────────────────────────────────
  // Puts the player in a "sandbox": it can still run and play video, but the browser
  // won't let it open new tabs/windows or redirect Vid Search to another page —
  // which is how most of these ads work. Some players refuse to play when sandboxed,
  // so it can be switched off per source (remembered on this device). On by default.
  const popupBtn = document.getElementById('popupBtn');
  const SANDBOX_RULES = 'allow-scripts allow-same-origin allow-forms allow-presentation allow-orientation-lock';

  // Inside the Vid Search Android app, the app blocks pop-ups itself (undetectably),
  // so the sandbox and its switch aren't needed there.
  const IN_APP = /VidSearchApp\//.test(navigator.userAgent);

  function popupsBlocked(key) {
    if (IN_APP) return false;
    try { return localStorage.getItem('vs_block_popups_' + key) !== '0'; } catch { return true; }
  }

  function applySandbox(key) {
    if (popupsBlocked(key)) playerFrame.setAttribute('sandbox', SANDBOX_RULES);
    else playerFrame.removeAttribute('sandbox');
  }

  function renderPopupBtn() {
    popupBtn.style.display = IN_APP ? 'none' : '';
    const on = popupsBlocked(getSourceKey());
    popupBtn.textContent = on ? 'Pop-ups blocked ✓' : 'Pop-ups allowed';
    popupBtn.classList.toggle('on', on);
  }

  popupBtn.addEventListener('click', async () => {
    const key = getSourceKey();
    try { localStorage.setItem('vs_block_popups_' + key, popupsBlocked(key) ? '0' : '1'); } catch {}
    renderPopupBtn();
    // The change only takes effect when the player reloads, so reload where you were
    if (current) {
      await domainReady;
      play({ ...current, startAt: Math.floor(estimatedPos()), autoplay: true });
    }
  });

  // ── Player helper (Android app only, beta) ──────────────────
  // The app can add a small helper inside the video player that finds the video and
  // obeys play / pause / jump — for every source, vidsrc included. Off unless switched on.
  const HOOK = (window.VS_HOOK && window.VS_HOOK.token) ? window.VS_HOOK : null;
  const hookBtn = document.getElementById('hookBtn');
  let hookReady = false;      // has the helper found the video in the current player?
  let hookWantPlay = true;    // should the video start by itself?
  let hookStartAt = 0;        // where it should start
  let hookLoadAt = 0;
  let hookPauseTries = 0;
  let hookSeen = false;       // has the helper said hello from inside the current player?

  // Player control is always on in the app now. For bug tests, set this to true to bring
  // back the on/off button (it also shows whether it's connected to the player).
  const SHOW_HOOK_BTN = false;

  function hookEnabled() {
    if (!HOOK) return false;
    if (!SHOW_HOOK_BTN) return true;
    // Not chosen yet: on for TVs (the remote can't tap a player's own buttons), off otherwise
    try {
      const v = localStorage.getItem('vs_hook');
      return v === null ? isTvLayout() : v === '1';
    } catch { return false; }
  }
  function hookActive() { return hookEnabled() && hookReady; }
  function hookSend(cmd, extra) {
    try { playerFrame.contentWindow.postMessage({ vsHookCmd: cmd, token: HOOK.token, ...(extra || {}) }, '*'); } catch {}
  }

  // Play / pause / jump for Skip, the floating window and headphones:
  // the helper when it's on and ready, otherwise the source's own commands (if it has any)
  function canControl(src) { return hookActive() || !!(src.pause && src.resume); }
  function ctlPause(src) { if (hookActive()) hookSend('pause'); else if (src.pause) src.pause(); }
  function ctlPlay(src)  { if (hookActive()) hookSend('play');  else if (src.resume) src.resume(); }
  function ctlSeek(src, t) {
    if (hookActive()) { hookSend('seek', { t }); return true; }
    if (src.seek) { src.seek(t); return true; }
    return false;
  }

  function renderHookBtn() {
    hookBtn.style.display = HOOK && SHOW_HOOK_BTN ? '' : 'none';
    const on = hookEnabled();
    // While a video is open, also say whether the helper is actually connected to it
    let state = on ? 'on' : 'off';
    if (on && current) {
      if (hookReady) state = 'on ✓ connected';
      else if (Date.now() - hookLoadAt < 8000) state = 'on · connecting…';
      else if (hookSeen) state = 'on · no video found';
      else state = 'on · not connected';
    }
    hookBtn.textContent = 'Player control (beta): ' + state;
    hookBtn.classList.toggle('on', on);
  }

  hookBtn.addEventListener('click', async () => {
    try { localStorage.setItem('vs_hook', hookEnabled() ? '0' : '1'); } catch {}
    renderHookBtn();
    if (current) {   // reload where you were, so the change applies now
      await domainReady;
      play({ ...current, startAt: Math.floor(estimatedPos()), autoplay: true });
    }
  });

  let current = null; // what's playing right now

  // ── Auto-play next episode ──────────────────────────────────
  const upNextEl     = document.getElementById('upNext');
  const upNextTitle  = document.getElementById('upNextTitle');
  const upNextCount  = document.getElementById('upNextCount');
  const UP_NEXT_LEAD = 15; // seconds before the end that the box appears
  let upNextTimer   = null;
  let upNextLeft    = 0;     // seconds until the next episode starts
  let upNextPaused  = false; // countdown waits while the video is paused
  let upNextStarting = false;
  let upNextDoneFor = null;  // after ✕, don't show again for the same episode

  function epKey(info) {
    return info ? `${info.imdbId}/${info.season}/${info.episode}` : '';
  }

  function cancelUpNext() {
    clearInterval(upNextTimer);
    upNextTimer = null;
    upNextEl.classList.remove('visible');
  }

  // autoplay = true when you tapped Next, false when the countdown ran out by itself
  // "Autoplay next" switch: when on, the next episode starts by itself when the countdown
  // runs out. When off, it's loaded but waits for you.
  const autoNextBtn = document.getElementById('autoNextBtn');
  function autoNextOn() {
    try { return localStorage.getItem('vs_autonext') === '1'; } catch { return false; }
  }
  function renderAutoNext() {
    const on = autoNextOn();
    autoNextBtn.textContent = 'Autoplay next: ' + (on ? 'on' : 'off');
    autoNextBtn.classList.toggle('on', on);
  }
  autoNextBtn.addEventListener('click', () => {
    try { localStorage.setItem('vs_autonext', autoNextOn() ? '0' : '1'); } catch {}
    renderAutoNext();
  });
  renderAutoNext();

  function goNext(autoplay) {
    cancelUpNext();
    step(1, { autoplay });
  }

  async function startUpNext(secondsLeft) {
    if (!current || current.isMovie || upNextTimer || upNextStarting) return;
    if (upNextDoneFor === epKey(current)) return;

    upNextStarting = true;
    const playing = current;
    const seasons = await getSeasons(playing.tmdbId);
    upNextStarting = false;
    const next = neighbour(seasons, playing.season, playing.episode, 1);
    if (!next || current !== playing || upNextTimer) return; // last episode, or you've moved on

    upNextLeft = Math.max(1, Math.ceil(secondsLeft));
    upNextPaused = false;
    upNextTitle.textContent = `S${next.season} · E${next.episode}`;
    upNextCount.textContent = upNextLeft;
    upNextEl.classList.add('visible');

    upNextTimer = setInterval(() => {
      if (upNextPaused) return;
      upNextLeft--;
      if (upNextLeft <= 0) goNext(autoNextOn()); // nobody tapped: start it only if Autoplay next is on
      else upNextCount.textContent = upNextLeft;
    }, 1000);
  }

  document.getElementById('upNextPlay').addEventListener('click', () => goNext(true));
  document.getElementById('upNextCancel').addEventListener('click', () => {
    upNextDoneFor = epKey(current);
    cancelUpNext();
  });

  // ── Skip intro / recap ──────────────────────────────────────
  // Timestamps come from free community databases:
  //   1. TheIntroDB (looked up by TMDB id)   2. SkipDB (by IMDb id) as a backup.
  // No data for an episode = no button. Nothing is sent except the show id + episode.
  const skipBtn   = document.getElementById('skipBtn');
  const skipCache = {};      // episode key -> [{ label, start, end }] (seconds)
  let skipSegs    = [];      // segments for what's playing now
  let skipFor     = '';      // which episode skipSegs belongs to
  let lastPos     = 0;       // last position the player reported (seconds)
  let lastPosAt   = 0;       // when it reported it
  let isPlaying   = false;

  // Accepts the slightly different shapes these APIs return
  function toSecs(seg) {
    if (!seg) return null;
    if (Array.isArray(seg)) seg = seg[0];
    if (!seg) return null;
    let start, end;
    if ('start_ms' in seg || 'end_ms' in seg) {
      start = seg.start_ms == null ? 0 : seg.start_ms / 1000;
      end   = seg.end_ms   == null ? null : seg.end_ms / 1000;
    } else {
      start = seg.start_sec ?? seg.start ?? 0;
      end   = seg.end_sec   ?? seg.end   ?? null;
    }
    start = Number(start) || 0;
    end   = Number(end);
    // Ignore anything implausible (no end, backwards, or longer than 5 minutes)
    if (!isFinite(end) || end <= start || end - start > 300) return null;
    return { start, end };
  }

  function segsFrom(data) {
    if (!data) return [];
    const src = data.segments || data;
    const out = [];
    const recap = toSecs(src.recap);
    const intro = toSecs(src.intro);
    if (recap) out.push({ label: 'Skip recap', ...recap });
    if (intro) out.push({ label: 'Skip intro', ...intro });
    return out;
  }

  async function fetchJSON(url) {
    const res = await Promise.race([
      fetch(url),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))
    ]);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function getSkipSegments(info) {
    const key = epKey(info);
    if (skipCache[key]) return skipCache[key];

    let segs = [];
    // 1) TheIntroDB, by TMDB id
    for (const v of ['v4', 'v3']) {
      if (segs.length) break;
      try {
        const data = await fetchJSON(`https://api.theintrodb.org/${v}/media?tmdb_id=${info.tmdbId}` +
                                     `&season=${info.season}&episode=${info.episode}`);
        segs = segsFrom(data);
      } catch {}
    }
    // 2) SkipDB, by IMDb id
    if (!segs.length) {
      try {
        const data = await fetchJSON(`https://api.skipdb.tv/api/segments?imdb_id=${info.imdbId}` +
                                     `&season=${info.season}&episode=${info.episode}`);
        segs = segsFrom(data);
      } catch {}
    }
    skipCache[key] = segs;
    return segs;
  }

  async function loadSkips(info) {
    skipSegs = [];
    skipFor  = epKey(info);
    skipBtn.classList.remove('visible');
    if (!info || info.isMovie) return;
    const segs = await getSkipSegments(info);
    if (epKey(current) === epKey(info)) skipSegs = segs;
  }

  // Where the video probably is right now (the player only reports every few seconds)
  function estimatedPos() {
    return isPlaying ? lastPos + (Date.now() - lastPosAt) / 1000 : lastPos;
  }

  function activeSkip() {
    if (!current || skipFor !== epKey(current) || !skipSegs.length) return null;
    const pos = estimatedPos();
    // Show from the start of the segment until 2 seconds before it ends
    return skipSegs.find(s => pos >= s.start - 0.5 && pos < s.end - 2) || null;
  }

  // "Auto skip intro" switch: when on, intros and recaps are skipped as soon as they start.
  // Each one only once per episode, so rewinding into an intro on purpose is left alone.
  const autoSkipBtn = document.getElementById('autoSkipBtn');
  const autoSkipped = new Set();     // "episode|start" of segments already skipped
  function autoSkipOn() {
    try { return localStorage.getItem('vs_autoskip') === '1'; } catch { return false; }
  }
  function renderAutoSkip() {
    const on = autoSkipOn();
    autoSkipBtn.textContent = 'Auto skip intro: ' + (on ? 'on' : 'off');
    autoSkipBtn.classList.toggle('on', on);
  }
  autoSkipBtn.addEventListener('click', () => {
    try { localStorage.setItem('vs_autoskip', autoSkipOn() ? '0' : '1'); } catch {}
    renderAutoSkip();
  });
  renderAutoSkip();

  function updateSkipBtn() {
    // Auto skip: only while actually playing, and once per intro/recap
    const seg0 = activeSkip();
    if (seg0 && autoSkipOn() && isPlaying) {
      const key = epKey(current) + '|' + seg0.start;
      if (!autoSkipped.has(key)) { autoSkipped.add(key); doSkip(seg0); return; }
    }
    // Sources with their own Skip button (VidRift) don't need ours as well
    const src = current && SOURCES[current.sourceKey || getSourceKey()];
    const seg = src && src.builtInSkip ? null : seg0;
    if (seg) skipBtn.textContent = seg.label;
    skipBtn.classList.toggle('visible', !!seg);
  }

  setInterval(updateSkipBtn, 500);

  skipBtn.addEventListener('click', () => {
    const seg = activeSkip();
    if (!seg || !current) return;
    autoSkipped.add(epKey(current) + '|' + seg.start);
    doSkip(seg);
  });

  function doSkip(seg) {
    skipBtn.classList.remove('visible');
    const src = SOURCES[current.sourceKey || getSourceKey()];
    const to  = Math.ceil(seg.end);

    if (ctlSeek(src, to)) {
      // This player takes commands (or the helper is on): jump straight there, no reload
      ctlPlay(src);
      lastPos = to; lastPosAt = Date.now();
    } else {
      // vidsrc can't be told to jump: reload the episode from just after the intro
      play({ ...current, startAt: to, autoplay: true });
    }
  }

  function play(info) {
    cancelUpNext();
    upNextDoneFor = null;
    current = info;
    lastPos = Math.floor(info.startAt || 0);
    lastPosAt = Date.now();
    isPlaying = false;
    loadSkips(info);

    // Something's been picked: clear the search results so the video sits at the top
    searchId++; // also drops any search still loading
    resultsDiv.innerHTML = '';
    statusDiv.textContent = '';

    // Build the player address for the chosen source.
    // startAt = where to start (resume); autoplay = start by itself
    // (anything you tap = yes; the Up next countdown running out = no).
    const startAt  = Math.floor(info.startAt || 0);
    const autoplay = info.autoplay !== false;
    const src      = SOURCES[getSourceKey()];
    current.sourceKey = getSourceKey();
    hookReady = false; hookWantPlay = autoplay; hookStartAt = startAt;
    hookLoadAt = Date.now(); hookPauseTries = 0; hookSeen = false;
    setTimeout(() => { if (current === info) renderHookBtn(); }, 8500);
    // Some players (vidsrc) open on a cover picture and wait for a tap. When the video should
    // start by itself, ask the helper to press the player's start button until the video shows up.
    if (autoplay && hookEnabled()) {
      [1500, 3000, 4500, 6500, 9000].forEach(ms => setTimeout(() => {
        if (current === info && !hookReady) hookSend('start');
      }, ms));
    }

    applySandbox(getSourceKey()); // must be set before loading so it applies
    playerFrame.src = src.url(info, startAt, autoplay);

    // Sources without a start-time setting get told once the player has loaded
    if (src.startAtByMessage && startAt > 0) {
      playerFrame.addEventListener('load', () => {
        if (current === info) src.seek(startAt);
      }, { once: true });
    }

    renderSourceBtns();
    renderHookBtn();
    npTitle.textContent = info.title;
    npEp.textContent = info.isMovie ? 'Movie' : `Season ${info.season} · Episode ${info.episode}`;

    // Save to Continue watching (episodes and films)
    const saved  = getProgress(info.imdbId);
    const sameEp = saved && (saved.season ?? null) === (info.season ?? null)
                         && (saved.episode ?? null) === (info.episode ?? null);
    saveProgress(info.imdbId, {
      ...info,
      pos: startAt,
      dur: sameEp ? saved.dur : 0
    });

    playerEl.classList.add('visible');
    document.body.classList.add('playing', 'watching');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    fitTvPlayer();

    // You've picked something: clear the search box and results
    queryInput.value = '';
    resultsDiv.innerHTML = '';
    statusDiv.textContent = '';

    // Take focus off the search box/buttons so N / B / F work straight away
    // (on the TV, the highlight moves to the video instead)
    if (isTvLayout() && frameWrap.dataset.nav) navFocus(frameWrap);
    else if (document.activeElement && document.activeElement !== document.body) {
      document.activeElement.blur();
    }

    updateNavButtons();
    renderContinue();
  }

  // TV, while watching: shrink the player just enough that it and all its buttons fit on
  // the screen, so moving the highlight never scrolls the page (a Fire Stick blanks a
  // video that's partly scrolled off the screen)
  function fitTvPlayer() {
    frameWrap.style.width = '';
    if (!document.body.classList.contains('tv') || !document.body.classList.contains('watching') ||
        frameWrap.classList.contains('tv-full')) return;
    const over = document.documentElement.scrollHeight - innerHeight;
    if (over > 0) {
      const h = Math.max(150, frameWrap.getBoundingClientRect().height - over - 4);
      frameWrap.style.width = Math.round(h * 16 / 9) + 'px';
    }
    if (scrollY) window.scrollTo(0, 0);
  }
  window.addEventListener('resize', () => fitTvPlayer());

  async function updateNavButtons() {
    if (!current || current.isMovie) {
      prevBtn.classList.add('hidden');
      nextBtn.classList.add('hidden');
      epJump.classList.add('hidden');
      fitTvPlayer();
      return;
    }
    prevBtn.classList.remove('hidden');
    nextBtn.classList.remove('hidden');
    epJump.classList.remove('hidden');
    fitTvPlayer();

    const playing = current;
    const seasons = await getSeasons(playing.tmdbId);
    if (current !== playing) return; // user already moved on
    prevBtn.disabled = !neighbour(seasons, playing.season, playing.episode, -1);
    nextBtn.disabled = !neighbour(seasons, playing.season, playing.episode, 1);
    fillEpisodeJump(seasons, playing.season, playing.episode);
    fitTvPlayer();
  }

  // ── Season / episode drop-downs ─────────────────────────────
  const epJump      = document.getElementById('epJump');
  const jumpSeason  = document.getElementById('jumpSeason');
  const jumpEpisode = document.getElementById('jumpEpisode');
  let jumpSeasons   = [];

  function fillEpisodes(seasonNum, selectedEp) {
    const s = jumpSeasons.find(x => x.n === seasonNum);
    const count = s ? s.count : 0;
    let html = selectedEp ? '' : '<option value="" selected disabled>Pick an episode</option>';
    for (let i = 1; i <= count; i++) {
      html += `<option value="${i}"${i === selectedEp ? ' selected' : ''}>Episode ${i}</option>`;
    }
    jumpEpisode.innerHTML = html;
  }

  // Show the season/episode that's playing
  function fillEpisodeJump(seasons, season, episode) {
    jumpSeasons = seasons;
    jumpSeason.innerHTML = seasons.map(s =>
      `<option value="${s.n}"${s.n === season ? ' selected' : ''}>Season ${s.n}</option>`
    ).join('');
    fillEpisodes(season, episode);
  }

  // Picking a season plays its Episode 1; picking an episode plays that episode
  jumpSeason.addEventListener('change', () => {
    if (!current || current.isMovie) return;
    const season = parseInt(jumpSeason.value);
    if (season === current.season) { fillEpisodes(season, current.episode); return; }
    fillEpisodes(season, 1);
    play({
      ...current, season, episode: 1, autoplay: true,
      startAt: resumePoint(getProgress(current.imdbId), season, 1)
    });
  });

  jumpEpisode.addEventListener('change', () => {
    if (!current || current.isMovie || !jumpEpisode.value) return;
    const season  = parseInt(jumpSeason.value);
    const episode = parseInt(jumpEpisode.value);
    if (season === current.season && episode === current.episode) return;
    play({
      ...current, season, episode, autoplay: true,
      startAt: resumePoint(getProgress(current.imdbId), season, episode)
    });
  });

  async function step(dir, opts = {}) {
    if (!current || current.isMovie) return;
    const seasons = await getSeasons(current.tmdbId);
    const target  = neighbour(seasons, current.season, current.episode, dir);
    if (!target) return;
    play({
      ...current, season: target.season, episode: target.episode, startAt: 0,
      autoplay: opts.autoplay !== false
    });
  }

  // ── Listen to the player's position reports ─────────────────
  // The player sends messages like:
  // { type: "PLAYER_EVENT", data: { player_status: "playing", player_progress: 1481.6,
  //   player_duration: 2880, player_info: { season: 1, episode: 2, ... } } }
  window.addEventListener('message', e => {
    if (!current) return;

    // Reports from the player helper (Android app, beta): they can come from a box nested
    // deep inside the player, so they're recognised by the helper's secret code instead.
    const hm = e.data;
    // The player's own fullscreen button (the app's helper catches it): use ours instead, so
    // Skip intro and Up next stay visible. Works whether or not Player control is switched on.
    if (hm && typeof hm === 'object' && hm.vsHook === 'fullscreen' && HOOK && hm.token === HOOK.token) {
      hookSend('fsAck');
      if (inAnyFullscreen()) { exitAllFullscreen(); return; }
      if (isTvLayout()) { setTvFull(true); return; }
      frameWrap.requestFullscreen()
        .then(() => { try { return screen.orientation.lock('landscape'); } catch {} })
        .catch(() => hookSend('fsFallback'));   // refused: let the player use its own fullscreen
      return;
    }
    if (hm && typeof hm === 'object' && hm.vsHook === 'key' && HOOK && hm.token === HOOK.token) {
      tvKeyFromPlayer(String(hm.key || ''));
      return;
    }
    if (hm && typeof hm === 'object' && hm.vsHook === 'tap' && HOOK && hm.token === HOOK.token) {
      lastPlayerTap = Date.now();
      return;
    }
    if (hm && typeof hm === 'object' && hm.vsHook === 'dbltap' && HOOK && hm.token === HOOK.token) {
      doubleTap(typeof hm.side === 'number' ? hm.side : Math.sign(hm.secs || 0));
      return;
    }
    if (hm && typeof hm === 'object' && hm.vsHook === 'hello' && HOOK && hm.token === HOOK.token) {
      if (!hookSeen) { hookSeen = true; renderHookBtn(); }
      return;
    }
    if (hm && typeof hm === 'object' && hm.vsHook === 'state' && HOOK && hm.token === HOOK.token) {
      if (!hookEnabled()) return;
      hookSeen = true;
      const hd = Number(hm.dur) || 0;
      const hp = Number(hm.pos) || 0;
      if (hd > 0 && hd < 90) return;               // a short clip (an ad), not the show
      if (!hookReady && hd > 0) {
        hookReady = true;
        renderHookBtn();
        hookSend('lock');      // the video's playing: stop ads dropping web pages into the player
        // Start at the right point, and play / stay paused as asked
        if (hookStartAt > 0 && Math.abs(hp - hookStartAt) > 15) hookSend('seek', { t: hookStartAt });
        if (hookWantPlay && hm.paused) hookSend('play');
      }
      // "Don't start by itself" (Up next ran out): if the player starts anyway in the
      // first few seconds, pause it (at most twice, so it never fights you)
      if (hookReady && !hookWantPlay && !hm.paused && hookPauseTries < 2 &&
          Date.now() - hookLoadAt < 12000) {
        hookPauseTries++;
        hookSend('pause');
      }
      handlePlayerUpdate({ status: hm.ended ? 'ended' : (hm.paused ? 'paused' : 'playing'), pos: hp, dur: hd });
      return;
    }

    // Only trust messages from the player we loaded
    let fromOurPlayer = e.source === playerFrame.contentWindow;
    if (!fromOurPlayer) {
      try { fromOurPlayer = new URL(e.origin).hostname === new URL(playerFrame.src).hostname; } catch {}
    }
    if (!fromOurPlayer) return;

    let msg = e.data;
    if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch { return; } }
    if (!msg || typeof msg !== 'object') return;

    // Translate this source's message into { status, pos, dur, season, episode }
    const src = SOURCES[current.sourceKey || getSourceKey()];
    let u = null;
    try { u = src.read(msg); } catch {}
    if (!u) return;
    handlePlayerUpdate(u);
  });

  // One report from the player — { status, pos, dur, season, episode } — from either the
  // source's own messages or the player helper. Saves progress, drives Skip and Up next.
  function handlePlayerUpdate(u) {
    // The player's fullscreen button: use our fullscreen instead (on/off).
    // Must happen right here, while the browser still counts it as your tap.
    if (u.fullscreenRequest) {
      if (document.fullscreenElement) {
        exitAllFullscreen();
      } else {
        frameWrap.requestFullscreen()
          .then(() => { try { return screen.orientation.lock('landscape'); } catch {} })
          .catch(() => {});
      }
      return;
    }

    // The player moved to another episode by itself (its own Next button)
    if (u.episodeChange && !current.isMovie && u.season != null && u.episode != null &&
        (u.season !== current.season || u.episode !== current.episode)) {
      current = { ...current, season: u.season, episode: u.episode, startAt: 0 };
      npEp.textContent = `Season ${u.season} · Episode ${u.episode}`;
      upNextDoneFor = null;
      cancelUpNext();
      loadSkips(current);
      saveProgress(current.imdbId, { ...current, pos: 0, dur: 0 });
      updateNavButtons();
      renderContinue();
      return;
    }

    const pos = u.pos;
    const dur = u.dur == null ? NaN : u.dur;
    if (pos == null) return;

    // Ignore reports about a different episode (e.g. a late message after pressing Next)
    if (!current.isMovie) {
      if (u.season != null && u.season !== current.season) return;
      if (u.episode != null && u.episode !== current.episode) return;
    }


    // Players report 0 for a moment while loading — don't let that wipe a saved spot
    const saved = getProgress(current.imdbId);
    if (pos < 1 && saved && saved.pos > 10 &&
        (saved.season ?? null) === (current.season ?? null) &&
        (saved.episode ?? null) === (current.episode ?? null)) return;

    saveProgress(current.imdbId, {
      ...current,
      pos,
      dur: isFinite(dur) && dur > 0 ? dur : (saved && saved.dur) || 0
    });

    // Refresh the Continue watching times when you pause or finish
    const status = u.status;
    if (status === 'paused' || status === 'ended') renderContinue();

    // Keep track of where the video is, for the Skip intro button
    lastPos   = pos;
    lastPosAt = Date.now();
    isPlaying = status === 'playing' || status === 'seeked' || status === 'timeupdate';
    updateSkipBtn();

    // ── Up next box ──
    const haveDur   = isFinite(dur) && dur > 0;
    const remaining = haveDur ? dur - pos : Infinity;
    const ended     = status === 'ended' || status === 'complete' || status === 'completed' ||
                      remaining <= 0.5;

    if (upNextTimer) upNextPaused = status === 'paused';

    if (ended) {
      // Episode finished: go now if the box was counting, otherwise show it briefly
      if (upNextTimer) goNext(autoNextOn());
      else startUpNext(5);
    } else if (remaining <= UP_NEXT_LEAD) {
      // Last 15 seconds: show the box, kept in step with the real time left
      if (!upNextTimer) startUpNext(remaining);
      else { upNextLeft = Math.max(1, Math.ceil(remaining)); upNextCount.textContent = upNextLeft; }
    } else if (upNextTimer && remaining > UP_NEXT_LEAD + 3 &&
               (status === 'playing' || status === 'seeked')) {
      cancelUpNext(); // you skipped back — it'll show again near the end
    }
  }

  // ── Our fullscreen ──────────────────────────────────────────
  // Makes the whole video area fullscreen (video + Up next box), not just the video,
  // so the box stays visible and you stay fullscreen when the next episode loads.
  const frameWrap = document.querySelector('.player-frame');

  // Stay in fullscreen: when you tap something in the player area that reloads the player
  // (Skip, ⟳, Next/Prev, episode drop-downs, source buttons, Up next), the app can drop out of
  // fullscreen. If that happens within a few seconds of the tap, go straight back in — the
  // tap still counts as permission to go fullscreen.
  let keepFsUntil = 0;
  // Backup for taps inside the player (the app's helper reports them): if something knocks
  // you out of fullscreen right after you touch the video, and it wasn't you leaving on
  // purpose (✕, Back, the fullscreen button), go straight back in.
  var lastPlayerTap = 0, fsLeaveAt = 0, inOurFs = false;
  document.addEventListener('fullscreenchange', () => {
    const was = inOurFs;
    inOurFs = document.fullscreenElement === frameWrap;
    if (was && !document.fullscreenElement && current &&
        Date.now() - lastPlayerTap < 2500 && Date.now() - fsLeaveAt > 1500) {
      frameWrap.requestFullscreen().catch(() => {});
    }
  });
  function armKeepFullscreen(e) {
    // Not for the buttons whose job is to leave fullscreen (fullscreen toggle, close)
    if (e && e.target && e.target.closest && e.target.closest('#fsBtn, #closeBtn')) { keepFsUntil = 0; return; }
    if (document.fullscreenElement === frameWrap) keepFsUntil = Date.now() + 4000;
  }
  const playerArea = document.getElementById('player');
  playerArea.addEventListener('click', armKeepFullscreen, true);
  playerArea.addEventListener('change', armKeepFullscreen, true);
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && Date.now() < keepFsUntil) {
      keepFsUntil = 0;
      frameWrap.requestFullscreen().catch(() => {});
    }
  });

  // On a TV: stretch the player over the screen instead of Android's fullscreen
  function setTvFull(on) {
    frameWrap.classList.toggle('tv-full', on);
    document.body.classList.toggle('tv-full-on', on);
    fitTvPlayer();
    if (frameWrap.dataset.nav) navFocus(frameWrap);
  }
  function inAnyFullscreen() {
    return !!document.fullscreenElement || frameWrap.classList.contains('tv-full');
  }

  async function toggleFullscreen() {
    if (isTvLayout() || frameWrap.classList.contains('tv-full')) {
      if (inAnyFullscreen()) await exitAllFullscreen();
      else setTvFull(true);
      return;
    }
    try {
      if (document.fullscreenElement) {
        await exitAllFullscreen();
      } else {
        await frameWrap.requestFullscreen();
        // On phones, turn sideways like a normal video player
        try { await screen.orientation.lock('landscape'); } catch {}
      }
    } catch {}
  }

  async function exitAllFullscreen() {
    fsLeaveAt = Date.now();                 // leaving on purpose: don't put you back in
    if (frameWrap.classList.contains('tv-full')) setTvFull(false);
    for (let i = 0; i < 3 && document.fullscreenElement; i++) {
      try { await document.exitFullscreen(); } catch { break; }
    }
  }

  let wasOurFullscreen = false;
  let swapping = false;

  // Did a swap fail on this device before? Then don't try again (stay with the player's fullscreen).
  function swapDisabled() {
    try { return localStorage.getItem('vs_fs_swap_failed2') === '1'; } catch { return false; }
  }

  // The player's own fullscreen only enlarges the video, hiding the Up next box.
  // Swap it for ours (video + box). Only tried when the browser confirms you just tapped,
  // because browsers refuse fullscreen otherwise.
  async function swapToOurFullscreen() {
    if (swapping || swapDisabled()) return;
    // If the browser can tell us you didn't just tap, don't try (it would be refused).
    // If it can't tell us at all, try anyway — a refusal is remembered below.
    const ua = navigator.userActivation;
    if (ua && !ua.isActive) return;

    swapping = true;
    try {
      await document.exitFullscreen();
      await frameWrap.requestFullscreen();
      try { await screen.orientation.lock('landscape'); } catch {}
    } catch {
      try { localStorage.setItem('vs_fs_swap_failed2', '1'); } catch {}
    }
    swapping = false;
    wasOurFullscreen = document.fullscreenElement === frameWrap;
  }

  document.addEventListener('fullscreenchange', () => {
    const el = document.fullscreenElement;
    if (swapping) return;

    // In our fullscreen, the player's own fullscreen button tries to go "more" fullscreen.
    // Treat that tap as "get me out" and leave fullscreen completely.
    if (wasOurFullscreen && el === playerFrame) {
      wasOurFullscreen = false;
      exitAllFullscreen();
      return;
    }

    // The player's own fullscreen button was used: switch to ours so Up next can show
    if (el === playerFrame) {
      swapToOurFullscreen();
      return;
    }

    wasOurFullscreen = el === frameWrap;
    if (!el) {
      try { screen.orientation.unlock(); } catch {}
    }
  });

  function closePlayer() {
    cancelUpNext();
    exitAllFullscreen();
    playerFrame.src = 'about:blank';
    playerEl.classList.remove('visible');
    document.body.classList.remove('playing', 'watching');
    current = null;
  }

  prevBtn.addEventListener('click', () => step(-1));
  nextBtn.addEventListener('click', () => step(1));
  document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);

  // Fire TV remote (the app passes these on): ≡ = fullscreen on/off, ⏪ ⏩ = 10 seconds
  window.vsToggleFullscreen = function () { if (current) toggleFullscreen(); };
  window.vsJump = function (secs) { return jumpBy(Number(secs) || 0) ? 'ok' : 'none'; };

  // The Android app's Back button is about to take you out of fullscreen (on purpose)
  window.vsLeavingFullscreen = function () { fsLeaveAt = Date.now(); };

  // For the Android app's picture-in-picture play/pause button.
  // vsPipState(): '0' = nothing playing, otherwise 3 digits: open, playing, can-control
  window.vsPipState = function () {
    if (!current) return '0';
    const src = SOURCES[current.sourceKey || getSourceKey()];
    return '1' + (isPlaying ? '1' : '0') + (canControl(src) ? '1' : '0');
  };

  // Reloading the player to resume only works for players that start by themselves
  // (VidNest, VidRift). vidsrc reloads to its cover picture and waits for a tap, so it's
  // resumed with a plain "play" instead.
  function resumeByReload() { return (current.sourceKey || getSourceKey()) !== 'vidsrc'; }

  window.vsPipToggle = function () {
    if (!current) return 'none';
    const src = SOURCES[current.sourceKey || getSourceKey()];
    if (!canControl(src)) return 'none';   // e.g. vidsrc without the helper
    if (isPlaying) {
      lastPos = estimatedPos(); lastPosAt = Date.now();
      ctlPause(src);
      isPlaying = false;
      return 'paused';
    }
    // Play: reload the player where it was paused (like the ⟳ button). Android often takes
    // a paused video's picture away in the floating window, and a plain "play" leaves it black.
    if (resumeByReload()) play({ ...current, startAt: Math.floor(lastPos), autoplay: true });
    else ctlPlay(src);
    isPlaying = true;
    lastPosAt = Date.now();
    return 'playing';
  };

  // For headphone buttons (via the Android app): play or pause.
  // reload = true when in the floating window, where a plain "play" can leave the picture black.
  window.vsPlayPause = function (wantPlay, reload) {
    if (!current) return 'none';
    const src = SOURCES[current.sourceKey || getSourceKey()];
    if (!canControl(src)) return 'none';
    if (!wantPlay) {
      if (isPlaying) { lastPos = estimatedPos(); lastPosAt = Date.now(); ctlPause(src); isPlaying = false; }
      return 'paused';
    }
    if (isPlaying) return 'playing';
    if (reload && resumeByReload()) play({ ...current, startAt: Math.floor(lastPos), autoplay: true });
    else ctlPlay(src);
    isPlaying = true;
    lastPosAt = Date.now();
    return 'playing';
  };

  // For the Android app's "now playing" card in the notification shade:
  // title, episode, where you are and how long it is (seconds)
  window.vsNowPlaying = function () {
    if (!current) return '';
    const saved = getProgress(current.imdbId);
    const sameEp = saved && (saved.season ?? null) === (current.season ?? null) &&
                   (saved.episode ?? null) === (current.episode ?? null);
    return JSON.stringify({
      t: npTitle.textContent || current.title || '',
      e: npEp.textContent || '',
      pos: Math.max(0, Math.floor(estimatedPos())),
      dur: sameEp && saved.dur > 0 ? Math.floor(saved.dur) : 0,
      next: hasNextEp()
    });
  };

  function hasNextEp() {
    return !!current && !current.isMovie && !nextBtn.disabled && !nextBtn.classList.contains('hidden');
  }

  // The card's ⏪ / ⏩ buttons: back or forward 10 seconds
  window.vsSkipBy = function (secs) {
    if (!current) return 'none';
    return window.vsSeekTo(estimatedPos() + (Number(secs) || 0));
  };

  // The card's ⏭ button: next episode (there's deliberately no "previous")
  window.vsNextEp = function () {
    if (!hasNextEp()) return 'none';
    step(1);
    return 'ok';
  };

  // Dragging the progress bar on that card
  window.vsSeekTo = function (t) {
    if (!current) return 'none';
    const src = SOURCES[current.sourceKey || getSourceKey()];
    t = Math.max(0, Math.floor(Number(t) || 0));
    if (!ctlSeek(src, t)) play({ ...current, startAt: t, autoplay: true });
    lastPos = t; lastPosAt = Date.now();
    return 'ok';
  };

  // Reload button: reloads only the player, at the point you were at.
  // Fixes a black/frozen video (e.g. after switching away from the app or tab).
  document.getElementById('reloadBtn').addEventListener('click', async () => {
    if (!current) return;
    await domainReady;
    play({ ...current, startAt: Math.floor(estimatedPos()), autoplay: true });
  });
  closeBtn.addEventListener('click', closePlayer);

  // Keyboard shortcuts — only when the player is open and you're not typing
  document.addEventListener('keydown', e => {
    if (!current) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;

    const k = e.key;
    if (k === 'n' || k === 'N' || k === 'MediaTrackNext')     { e.preventDefault(); step(1); }
    if (k === 'b' || k === 'B' || k === 'MediaTrackPrevious') { e.preventDefault(); step(-1); }  });

  // ── Search ───────────────────────────────────────────────────
  searchBtn.addEventListener('click', doSearch);
  queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  let searchId = 0; // stops a slow old search from overwriting a newer one

  async function doSearch() {
    const query = queryInput.value.trim();
    if (!query) return;

    // Searching while something's playing = you want something else.
    // Close the player (your spot is saved in Continue watching) so results are at the top.
    if (current) closePlayer();
    document.body.classList.add('playing'); // compact header so results sit near the top

    const myId = ++searchId;
    resultsDiv.innerHTML = '';
    statusDiv.textContent = 'Searching...';

    try {
      const data = await tmdb('search/multi', `&query=${encodeURIComponent(query)}&page=1`);
      if (myId !== searchId) return;

      const results = (data.results || [])
        .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
        .slice(0, 5);

      if (results.length === 0) {
        statusDiv.textContent = 'No results found.';
        return;
      }

      statusDiv.textContent = `${results.length} result${results.length > 1 ? 's' : ''}`;
      results.forEach(item => renderCard(item));

    } catch (err) {
      if (myId === searchId) statusDiv.textContent = 'Something went wrong. Check your connection.';
    }
  }

  // ── Render card ──────────────────────────────────────────────
  // A search result. Tapping it (or Open) opens its show page, with the episodes,
  // the Play / Resume button and My List.
  function renderCard(item) {
    const isMovie = item.media_type === 'movie';
    const title   = isMovie ? item.title : item.name;
    const year    = isMovie
      ? (item.release_date || '').slice(0, 4)
      : (item.first_air_date || '').slice(0, 4);
    const type    = isMovie ? 'Movie' : 'TV Series';
    const poster  = item.poster_path
      ? `<img class="result-poster" src="https://image.tmdb.org/t/p/w92${item.poster_path}" alt="${esc(title)}">`
      : `<div class="no-poster">🎬</div>`;

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="card-main">
        ${poster}
        <div class="result-info">
          <div class="result-title">${esc(title)}</div>
          <div class="result-meta">${type}${year ? ' · ' + year : ''}</div>
        </div>
        <button class="stream-btn">Open</button>
      </div>`;
    const open = () => openDetails(item.id, isMovie);
    card.querySelector('.stream-btn').addEventListener('click', open);
    card.querySelectorAll('.result-poster, .no-poster, .result-info').forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', open);
    });
    resultsDiv.appendChild(card);
  }

  // ── Fetch IMDB ID ────────────────────────────────────────────
  async function fetchImdbId(tmdbId, isMovie) {
    if (!isMovie) return (await getShow(tmdbId)).imdbId;
    const data = await tmdb(`movie/${tmdbId}/external_ids`);
    return data.imdb_id || null;
  }
