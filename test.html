<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✏️ TAGLINE: change the words between the quotes. Keep the quotes and the semicolon. -->
<script>const TAGLINE = "The first and only streaming site to publicly condemn 9/11";</script>

<title>Vid Search (TEST)</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #e5383b;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* No text cursor or text selection except where you type */
  html { -webkit-user-select: none; user-select: none; caret-color: transparent; }
  input, textarea { -webkit-user-select: text; user-select: text; caret-color: auto; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: 0.05em;
    color: var(--text);
    line-height: 1;
    margin-bottom: 0.2em;
  }

  h1 span { color: var(--accent); }
  .home-logo { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    margin-bottom: 2.5rem;
  }

  /* ── Built-in player ───────────────────────────── */
  .player {
    width: 100%;
    max-width: 960px;
    margin-bottom: 2.5rem;
    display: none;
  }

  .player.visible { display: block; }

  .player-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  /* Our fullscreen: video + Up next box fill the screen together */
  .player-frame:fullscreen {
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    border: none;
    border-radius: 0;
  }

  .player-frame:fullscreen .up-next { top: 1rem; right: 1rem; }

  /* TV fullscreen: the player simply stretched over the whole screen. (Android's own
     fullscreen leaves the picture small in the corner on a Fire Stick.) */
  .player-frame.tv-full {
    position: fixed; inset: 0; z-index: 900;
    width: 100vw; height: 100vh; aspect-ratio: auto;
    border: none; border-radius: 0;
  }
  body.tv-full-on { overflow: hidden; }
  body.tv .player-frame.tv-full:focus { outline: none !important; }
  .player-frame.tv-full .up-next { top: 1rem; right: 1rem; }
  .player-frame.tv-full .skip-btn { right: 1.5rem; bottom: 5rem; font-size: 1.3rem; }

  /* Skip intro / recap button: bottom-right, above the player's own controls */
  .skip-btn {
    position: absolute;
    right: 0.6rem;
    bottom: 3.6rem;
    display: none;
    background: rgba(10, 10, 10, 0.88);
    color: var(--text);
    border: 1px solid var(--text);
    border-radius: 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    padding: 0.45rem 1rem;
    cursor: pointer;
  }

  .skip-btn.visible { display: block; }
  .skip-btn:hover { background: var(--text); color: #0a0a0a; }
  .player-frame:fullscreen .skip-btn { right: 1.5rem; bottom: 5rem; font-size: 1.3rem; }

  /* Source switch (vidsrc / VidNest / VidRift) */
  /* Season / episode drop-downs under Prev / Next */
  /* Drop-downs (season / episode under the player) */
  select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 0.35rem 0.5rem;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
    max-width: 120px;
  }
  select:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }

  .ep-jump {
    display: flex;
    gap: 0.6rem;
    margin-top: 0.6rem;
  }

  .ep-jump.hidden { display: none; }

  .ep-jump select {
    flex: 1;
    max-width: none;
    font-size: 0.95rem;
    padding: 0.5rem 0.6rem;
  }

  .source-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.6rem;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .source-label { text-transform: uppercase; letter-spacing: 0.1em; margin-right: 0.2rem; }

  .src-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    padding: 0.3rem 0.7rem;
    border-radius: 3px;
    cursor: pointer;
  }

  .src-btn.active { border-color: var(--accent); color: var(--text); background: rgba(229, 56, 59, 0.15); }
  .hook-btn.on { border-color: #6fcf8f; color: #6fcf8f; }

  /* Pop-up blocker switch: sits at the right end of the Source row */
  .popup-btn { margin-left: auto; }
  .popup-btn.on { border-color: #6fcf8f; color: #6fcf8f; }


  #fsBtn, #reloadBtn { display: flex; align-items: center; justify-content: center; }
  #fsBtn svg, #reloadBtn svg { width: 1.1rem; height: 1.1rem; }

  /* The small icon buttons (reload, fullscreen, close) stay compact so all five fit on a phone */
  .player-bar .ctrl-btn.ghost { flex: 0 0 2.9rem; padding: 0; display: flex; align-items: center; justify-content: center; }

  .player-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .now-playing {
    margin-top: 0.75rem;
    text-align: center;
    min-width: 0;
  }

  .player-bar {
    display: flex;
    align-items: stretch;
    gap: 0.6rem;
    margin-top: 0.6rem;
  }

  /* Prev and Next share the width equally; the ✕ stays small */
  #prevBtn, #nextBtn { flex: 1; }

  #npTitle {
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #npEp {
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .ctrl-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    padding: 0.55rem 1.2rem;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s;
  }

  .ctrl-btn:hover { opacity: 0.85; }
  .ctrl-btn:disabled { opacity: 0.25; cursor: default; }
  .ctrl-btn.hidden { visibility: hidden; }

  .ctrl-btn.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }


  .search-row {
    display: flex;
    gap: 0.75rem;
    width: 100%;
    max-width: 560px;
    margin-bottom: 2rem;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0; /* lets the box shrink so the Search button stays on screen */
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    padding: 0.85rem 1.2rem;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  button#searchBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    padding: 0 1.6rem;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  button#searchBtn:hover { opacity: 0.85; }

  /* ── Continue watching ─────────────────────────── */
  /* Sync between devices */
  .sync-box {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 2rem;
  }

  .sync-row { display: flex; gap: 0.5rem; }

  .sync-row input[type="text"] {
    font-size: 0.9rem;
    padding: 0.55rem 0.8rem;
  }

  .sync-status { font-size: 0.78rem; color: var(--muted); }
  .sync-status.ok { color: #6fcf8f; }
  .sync-status.err { color: var(--accent); }

  #continue {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 2rem;
  }

  .section-label {
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .remove-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.2rem 0.4rem;
    flex-shrink: 0;
  }

  .remove-btn:hover { color: var(--text); }

  /* ── Up next box (small, top-right corner of the video) ── */
  .up-next {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    max-width: calc(100% - 1.2rem);
    background: rgba(10, 10, 10, 0.92);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 0.5rem 0.5rem 0.5rem 0.75rem;
    display: none;
    align-items: center;
    gap: 0.75rem;
  }

  .up-next.visible { display: flex; }

  .up-next-text { min-width: 0; }

  .up-next-label {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  .up-next-title {
    font-weight: 500;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  .up-next .ctrl-btn {
    font-size: 0.95rem;
    padding: 0.4rem 0.8rem;
  }

  .up-next .remove-btn { padding: 0.2rem 0.3rem; }

  /* Thin bar along the bottom of a Continue watching card showing how far in you are */
  .progress-track {
    height: 3px;
    background: var(--border);
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
  }

  #results {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  #results:not(:empty) { margin-bottom: 2rem; }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .result-card:hover { border-color: var(--accent); }

  .card-main {
    padding: 0.6rem 1rem 0.6rem 0.6rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .result-poster {
    width: 48px;
    height: 72px;
    object-fit: cover;
    border-radius: 3px;
    background: var(--border);
    flex-shrink: 0;
  }

  .no-poster {
    width: 48px;
    height: 72px;
    border-radius: 3px;
    background: var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  .result-info { flex: 1; min-width: 0; }

  .result-title {
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 0.2rem;
  }

  .result-meta {
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .result-meta .resume-hint {
    color: var(--accent);
    margin-left: 0.4em;
  }

  .stream-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    padding: 0.4rem 1rem;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
    flex-shrink: 0;
  }

  .stream-btn:hover { background: var(--accent); color: #fff; }


  #status {
    color: var(--muted);
    font-size: 0.85rem;
    margin: -1rem 0 1rem;
  }

  #status:empty { display: none; }

  /* Clear highlight on whatever the keyboard is pointing at (handy on a TV) */
  button:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }



  /* ── Home screen rows ──────────────────────────── */
  .home { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 1.4rem; margin-bottom: 2rem; }
  .home:empty { display: none; }
  body.playing .home { display: none; }
  .row { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
  .row-track {
    display: flex; gap: 0.6rem; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity; padding: 4px 2px 8px; scrollbar-width: none;
  }
  .row-track::-webkit-scrollbar { display: none; }
  .tile {
    flex: none; width: 7.4rem; background: none; border: none; padding: 0; cursor: pointer;
    color: var(--text); text-align: left; font-family: inherit; scroll-snap-align: start; border-radius: 6px;
  }
  .tile-poster, .tile .no-art {
    display: block; width: 100%; aspect-ratio: 2 / 3; border-radius: 6px; background: var(--surface2);
    object-fit: cover; transition: transform 0.15s;
  }
  .tile .no-art { display: flex; align-items: center; justify-content: center; padding: 0.4rem; text-align: center; font-size: 0.8rem; color: var(--muted); }
  .tile-title { display: block; margin-top: 0.35rem; font-size: 0.78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile:hover .tile-poster, .tile:focus .tile-poster { transform: scale(1.04); }
  .tile:hover .tile-title, .tile:focus .tile-title { color: var(--text); }
  .row-msg { color: var(--muted); font-size: 0.8rem; padding: 0.5rem 0; }
  /* ‹ › arrows at the ends of a row (computers with a mouse only; phones swipe, the TV uses the remote) */
  .row-wrap { position: relative; }
  .row-btn {
    position: absolute; top: 0; bottom: 8px; z-index: 2; width: 2.6rem; display: none;
    align-items: center; justify-content: center; border: none; cursor: pointer;
    color: #fff; font-size: 2.2rem; line-height: 1; font-family: inherit;
  }
  .row-btn.prev { left: 0; background: linear-gradient(to right, rgba(10,10,10,0.92), rgba(10,10,10,0)); justify-content: flex-start; padding-left: 0.3rem; }
  .row-btn.next { right: 0; background: linear-gradient(to left, rgba(10,10,10,0.92), rgba(10,10,10,0)); justify-content: flex-end; padding-right: 0.3rem; }
  @media (hover: hover) and (pointer: fine) {
    body:not(.tv) .row-wrap:hover .row-btn:not(.end) { display: flex; }
  }
  /* Titles are for reading, not for a text cursor */
  .tile, .ep, .d-season { user-select: none; -webkit-user-select: none; }
  .tile:focus-visible, .ep:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  body.tv .tile { width: 6.4rem; }

  /* ── Show page ─────────────────────────────────── */
  .details { position: fixed; inset: 0; z-index: 800; background: var(--bg); overflow-y: auto; display: none; }
  .details.open { display: block; }
  body.details-open { overflow: hidden; }
  .d-hero { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 56vh; background: var(--surface) center / cover no-repeat; }
  .d-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,10,10,0) 35%, var(--bg) 100%); pointer-events: none; }
  .d-close {
    position: absolute; top: 0.8rem; right: 0.8rem; z-index: 2; width: 2.5rem; height: 2.5rem; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.65); color: #fff; font-size: 1.1rem; cursor: pointer;
  }
  .d-body { max-width: 960px; margin: -4rem auto 0; position: relative; z-index: 1; padding: 0 1.2rem 3rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .d-title { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(2.1rem, 6vw, 3.4rem); letter-spacing: 0.04em; line-height: 1; }
  .d-meta { color: #999; font-size: 0.85rem; }
  .d-meta .star { color: #f4c542; }
  .d-overview { font-size: 0.92rem; line-height: 1.5; color: #ccc; max-width: 70ch; }
  .d-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .d-play { background: var(--accent); color: #fff; padding: 0.55rem 1.4rem; font-size: 1.1rem; }
  .d-play:hover, .d-play:focus { background: #c92a2d; color: #fff; }
  .d-list.on { border-color: var(--text); color: var(--text); }
  .d-seasons { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .d-season.on { border-color: var(--accent); color: var(--accent); }
  .d-eps { display: flex; flex-direction: column; gap: 0.5rem; }
  .ep {
    display: flex; gap: 0.8rem; align-items: flex-start; width: 100%; padding: 0.5rem; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: inherit; text-align: left;
  }
  .ep:hover, .ep:focus { border-color: var(--text); }
  .ep-still { position: relative; flex: none; width: 8.5rem; aspect-ratio: 16 / 9; border-radius: 4px; background: var(--surface2); overflow: hidden; }
  .ep-still img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ep-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.25); }
  .ep-bar i { display: block; height: 100%; background: var(--accent); }
  .ep-tick {
    position: absolute; top: 4px; right: 4px; width: 1.4rem; height: 1.4rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75); color: #6fcf8f; font-size: 0.8rem; font-weight: 500;
  }
  .new-badge {
    display: inline-block; margin-right: 0.35rem; padding: 0.08rem 0.4rem; border-radius: 3px;
    background: var(--accent); color: #fff; font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; vertical-align: 1px;
  }
  .ep-info { min-width: 0; display: flex; flex-direction: column; gap: 0.2rem; }
  .ep-name { font-size: 0.9rem; font-weight: 500; }
  .ep-sub { font-size: 0.75rem; color: var(--muted); }
  .ep-desc { font-size: 0.78rem; color: #aaa; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .d-msg { color: var(--muted); font-size: 0.85rem; }
  .d-body .section-label { margin-top: 0.6rem; }
  body.tv .d-hero { max-height: 46vh; }
  @media (max-width: 600px) {
    .ep-still { width: 7rem; }
    .d-body { padding: 0 1rem 2.5rem; margin-top: -3rem; }
  }

  /* ── Who's watching (profiles) ─────────────────── */
  .who {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(10, 10, 10, 0.97);
    display: none; align-items: center; justify-content: center;
    padding: 2rem 1rem; overflow-y: auto;
  }
  .who.open { display: flex; }
  body.who-open { overflow: hidden; }
  .who-inner { width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: center; gap: 1.6rem; margin: auto; }
  .who-title { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(2.2rem, 6vw, 3.4rem); letter-spacing: 0.05em; text-align: center; }
  .who-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2rem; }
  .who-tile {
    background: none; border: none; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
    font-family: inherit; font-size: 1rem; padding: 0.4rem; width: 7.4rem; border-radius: 8px;
  }
  .who-tile .who-icon { width: 6rem; height: 6rem; font-size: 3rem; border: 3px solid transparent; transition: border-color 0.15s, transform 0.15s; }
  .who-tile:hover, .who-tile:focus { color: var(--text); outline: none !important; }
  .who-tile:hover .who-icon, .who-tile:focus .who-icon { border-color: var(--text); transform: scale(1.06); }
  .who-tile.add .who-icon { background: transparent; border: 2px dashed var(--border); color: var(--muted); font-family: 'DM Sans', sans-serif; }
  .who-tile.add:hover .who-icon, .who-tile.add:focus .who-icon { border-color: var(--text); }
  .who.manage .who-tile:not(.add) .who-icon::after {
    content: '✎'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55); border-radius: inherit; font-size: 2rem; font-family: 'DM Sans', sans-serif;
  }
  .who-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
  .who-icon {
    position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none;
    border-radius: 8px; color: #fff; font-family: 'Bebas Neue', sans-serif; line-height: 1; user-select: none;
  }
  .who-edit { display: none; width: 100%; max-width: 460px; flex-direction: column; gap: 0.9rem; }

  .who-edit-head { display: flex; align-items: center; gap: 0.8rem; font-size: 1.1rem; }

  .src-btn.danger { border-color: var(--accent); color: var(--accent); }
  .who .stream-btn { padding: 0.5rem 1.4rem; }

  /* Your profile, top corner (tap to switch) */

  .profile-chip .who-icon { width: 2.3rem; height: 2.3rem; font-size: 1.25rem; border-radius: 6px; }
  .who-now { display: flex; align-items: center; gap: 0.6rem; flex: 1; min-width: 0; font-size: 0.9rem; }
  .who-now .who-icon { width: 2rem; height: 2rem; font-size: 1.1rem; border-radius: 5px; }

  /* "+10s" / "−10s" bubble after a double-tap or a remote press */
  .jump-bubble {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 6; pointer-events: none;
    background: rgba(0, 0, 0, 0.65); color: #fff; border-radius: 999px; padding: 0.6rem 1.1rem;
    font-weight: 500; font-size: 1.1rem; opacity: 0; transition: opacity 0.25s;
  }
  .jump-bubble.left { left: 8%; }
  .jump-bubble.right { right: 8%; }
  .jump-bubble.center { left: 50%; transform: translate(-50%, -50%); }
  .jump-bubble.show { opacity: 1; }

  /* ── TV layout (Fire Stick) ────────────────────── */
  /* Bigger text, a highlight on whatever the remote is pointing at, and Continue
     watching as a panel down the right-hand side */
  html.tv { font-size: 18px; }
  body.tv { padding: 1.2rem calc(30vw + 1.5rem) 1.5rem 1.5rem; justify-content: flex-start; }
  body.tv h1 { font-size: 2.4rem; margin-bottom: 0.4rem; }
  body.tv .subtitle { margin-bottom: 1.2rem; }
  body.tv .profile-chip { right: auto; left: 1rem; }
  /* TV, while a video is open: just the player and its buttons, sized to fit the screen,

  body.tv.watching h1, body.tv.watching .subtitle, body.tv.watching .search-row,
  body.tv.watching #status, body.tv.watching #syncBox, body.tv.watching .profile-chip { display: none; }
  body.tv.watching { padding-top: 0.8rem; padding-bottom: 0.4rem; }
  body.tv.watching .player-frame:not(.tv-full) { margin-left: auto; margin-right: auto; }
  .tv-panel { display: none; }
  body.tv .tv-panel {
    display: flex; flex-direction: column; position: fixed; top: 0; right: 0; bottom: 0; width: 30vw; z-index: 50;
    background: var(--surface); border-left: 1px solid var(--border); padding: 1rem 0.8rem; overflow-y: auto;
  }
  body.tv .tv-panel #continue { max-width: none; margin: 0; }
  body.tv .tv-panel .card-main { flex-wrap: wrap; gap: 0.5rem 0.7rem; padding: 0.5rem; }
  body.tv .tv-panel .result-info { flex: 1 1 55%; }
  body.tv .tv-panel .stream-btn { flex: 1; }

  body.tv .player-frame:focus { outline-offset: 2px; overflow: visible; }
  body.tv .result-card:focus-within { border-color: var(--text); }

  /* While something is playing, shrink the big title so search + video fit on screen */

  body.playing .subtitle { display: none; }

  /* Phones */

<body>

<button id="profileChip" class="profile-chip" title="Switch profile" aria-label="Switch profile"></button>
<h1 id="homeLogo" class="home-logo" tabindex="0" role="button" data-nav title="Home">VID<span>SEARCH</span></h1>
<p class="subtitle" id="tagline"></p>
<script>

  document.getElementById('tagline').textContent = typeof TAGLINE === 'string' ? TAGLINE : '';

<div class="search-row">

<!-- Search results sit right under the search bar -->

<!-- Built-in player (hidden until something is played) -->

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>

  <!-- Season / episode drop-downs (TV only). Picking an episode plays it. -->

<!-- Profile: who's watching, and syncing their history between devices -->

<!-- TV layout: Continue watching moves into this side panel -->

<!-- Show page: backdrop, info, episodes, More like this -->

<!-- Who's watching? (shown when the app opens, if there's more than one profile) -->
<div id="who" class="who" role="dialog" aria-label="Who's watching">
  <div class="who-inner">
    <h2 id="whoTitle" class="who-title">Who's watching?</h2>
    <div id="whoTiles" class="who-tiles"></div>
    <div class="who-actions who-main-actions">

        <input type="text" id="editName" maxlength="20" autocomplete="off">
      </label>

        <small>Private: it's what keeps this person's history in sync. Type the same one on each device. Leave it blank to keep the history on this device only.</small>
        <input type="text" id="editCode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. john123">
      </label>
