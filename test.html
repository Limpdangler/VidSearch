              <select class="season-select"><option>S1</option></select>
              <span>Season</span>
            </div>
            <div class="ep-select-wrap">
              <select class="episode-select"><option>E1</option></select>
              <span>Episode</span>
            </div>
          </div>
          <button class="ep-go-btn">Play</button>
        </div>
        <div class="ep-loading">Loading episodes...</div>
      </div>` : ''}
    `;

    const streamBtn = card.querySelector('.stream-btn');
    const epPicker  = card.querySelector('.ep-picker');

    if (isMovie) {
      streamBtn.addEventListener('click', () => openStream(item, true, null, null, title));
    } else {
      const sSel      = card.querySelector('.season-select');
      const eSel      = card.querySelector('.episode-select');
      const goBtn     = card.querySelector('.ep-go-btn');
      const epLoading = card.querySelector('.ep-loading');
      let cachedImdbId  = null;
      let seasonData    = []; // [{ n: seasonNumber, count: episodeCount }]

      function updateEpisodes(keepEp) {
        const sNum   = parseInt(sSel.value);
        const season = seasonData.find(s => s.n === sNum);
        const count  = season ? season.count : 1;
        const chosen = keepEp || 1;
        eSel.innerHTML = Array.from({ length: count }, (_, i) =>
          `<option value="${i + 1}"${i + 1 === chosen ? ' selected' : ''}>E${i + 1}</option>`
        ).join('');
      }

      sSel.addEventListener('change', () => updateEpisodes());

      // One request gets the seasons and IMDB ID together, then restores saved progress
      getShow(item.id).then(show => {
        seasonData   = show.seasons;
        cachedImdbId = show.imdbId;

        if (!cachedImdbId || !seasonData.length) {
          epLoading.textContent = 'No episodes available for this show.';
          return;
        }

        sSel.innerHTML = seasonData.map(s =>
          `<option value="${s.n}">S${s.n}</option>`
        ).join('');
        updateEpisodes();
        epLoading.style.display = 'none';

        const saved = getProgress(cachedImdbId);
        if (saved && seasonData.some(s => s.n === saved.season)) {
          sSel.value = saved.season;
          updateEpisodes(saved.episode);
          const pct = isFinished(saved) ? 0 : percent(saved);
          card.querySelector('.resume-hint').textContent =
            `· S${saved.season}E${saved.episode}${pct ? ' · ' + pct + '%' : ''} saved`;
        }
      }).catch(() => {
        epLoading.textContent = 'Could not load episode list.';
      });

      // Stream button (shows) — open/close the episode picker; Play starts it
      streamBtn.addEventListener('click', () => {
        epPicker.classList.toggle('visible');
      });

      // Play button — play the chosen episode
      goBtn.addEventListener('click', () => {
        if (!cachedImdbId) {
          statusDiv.textContent = 'Still loading, try again in a second...';
          return;
        }
        openStream(item, false, parseInt(sSel.value), parseInt(eSel.value), title, cachedImdbId);
      });
    }

    resultsDiv.appendChild(card);
  }

  // ── Fetch IMDB ID ────────────────────────────────────────────
  async function fetchImdbId(tmdbId, isMovie) {
    if (!isMovie) return (await getShow(tmdbId)).imdbId;
    const data = await tmdb(`movie/${tmdbId}/external_ids`);
    return data.imdb_id || null;
  }

  // ── Open stream (now plays in the built-in player) ───────────
  async function openStream(item, isMovie, season, episode, title, cachedImdbId) {
    statusDiv.textContent = 'Loading...';
    await domainReady; // ensure domain check has finished before building URL

    try {
      const imdbId = cachedImdbId || await fetchImdbId(item.id, isMovie);

      if (!imdbId) {
        statusDiv.textContent = 'No IMDB ID found for this title.';
        return;
      }

      statusDiv.textContent = '';

      play({
        tmdbId: item.id,
        imdbId,
        title,
        poster: item.poster_path,
        isMovie,
        season,
        episode,
        startAt: resumePoint(getProgress(imdbId), season, episode)
      });

    } catch (err) {
      statusDiv.textContent = 'Failed to open stream. Try again.';
    }
  }


  // ── TV remote: move a highlight around with the arrow buttons ──
  // Whatever's highlighted gets pressed with OK. On the video: OK = Skip intro if it's
  // showing, otherwise play / pause; ◀ ▶ = back / forward 10 seconds.
  const tvPanel  = document.getElementById('tvPanel');
  const syncBox  = document.getElementById('syncBox');
  const tvToggle = document.getElementById('tvToggle');
  const NAV_SEL  = 'button, input, select, a[href], [data-nav]';

  function applyTvLayout() {
    const on = isTvLayout();
    document.documentElement.classList.toggle('tv', on);
    document.body.classList.toggle('tv', on);
    if (on && continueDiv.parentNode !== tvPanel) tvPanel.appendChild(continueDiv);
    if (!on && continueDiv.parentNode === tvPanel) syncBox.before(continueDiv);
    // On TV the video area itself can be highlighted
    if (on) { frameWrap.tabIndex = 0; frameWrap.dataset.nav = '1'; }
    else    { frameWrap.removeAttribute('tabindex'); delete frameWrap.dataset.nav; }
    const s = tvSetting();
    tvToggle.textContent = 'TV layout: ' + (s === 'auto' ? `auto (${on ? 'on' : 'off'})` : s);
    if (on) renderContinue();
  }
  tvToggle.addEventListener('click', () => {
    const next = { auto: 'on', on: 'off', off: 'auto' }[tvSetting()] || 'auto';
    try { localStorage.setItem('vs_tv', next); } catch {}
    applyTvLayout();
    tvToggle.focus();
  });

  function navVisible(el) {
    if (el.disabled) return false;
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== 'hidden' && cs.display !== 'none';
  }

  // Only what's on top counts: the Who's watching screen, or the fullscreen video
  function navItems() {
    const scope = whoEl.classList.contains('open') ? whoEl : (document.fullscreenElement || document);
    const items = [...scope.querySelectorAll(NAV_SEL)];
    if (scope !== document && scope.matches && scope.matches(NAV_SEL)) items.unshift(scope);
    return items.filter(navVisible);
  }

  function navFocus(el) {
    try { el.focus({ preventScroll: true }); } catch { el.focus(); }
    const r = el.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 50) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // Nearest thing in that direction (straight lines win over diagonals)
  function navMove(dir) {
    const items = navItems();
    const cur = document.activeElement;
    if (!cur || cur === document.body || !items.includes(cur)) {
      const first = items.find(el => el === frameWrap) || items[0];
      if (first) { navFocus(first); return true; }
      return false;
    }
    const a = cur.getBoundingClientRect();
    const acx = a.left + a.width / 2, acy = a.top + a.height / 2;
    const gap = (a1, a2, b1, b2) => Math.max(0, b1 - a2, a1 - b2);
    // ▲ ▼ stay on their own side (main page or the TV side panel); ◀ ▶ cross between them
    const side = el => !!(el.closest && el.closest('#tvPanel'));
    const curSide = side(cur);
    let best = null, bestScore = Infinity;
    for (const el of items) {
      if (el === cur) continue;
      if ((dir === 'up' || dir === 'down') && side(el) !== curSide) continue;
      const b = el.getBoundingClientRect();
      const bcx = b.left + b.width / 2, bcy = b.top + b.height / 2;
      let along, cross, off;
      if (dir === 'down')  { if (bcy <= acy + 1) continue; along = Math.max(0, b.top - a.bottom); }
      if (dir === 'up')    { if (bcy >= acy - 1) continue; along = Math.max(0, a.top - b.bottom); }
      if (dir === 'right') { if (b.left < a.right - 4) continue; along = b.left - a.right; }
      if (dir === 'left')  { if (b.right > a.left + 4) continue; along = a.left - b.right; }
      if (dir === 'up' || dir === 'down') { cross = gap(a.left, a.right, b.left, b.right); off = Math.abs(bcx - acx); }
      else                                { cross = gap(a.top, a.bottom, b.top, b.bottom); off = Math.abs(bcy - acy); }
      const score = along + cross * 3 + off * 0.1;
      if (score < bestScore) { bestScore = score; best = el; }
    }
    if (best) { navFocus(best); return true; }
    return false;
  }

  // "+10s" / "−10s" bubble (adds up if you keep pressing)
  const jumpBubble = document.getElementById('jumpBubble');
  let jumpTotal = 0, jumpTimer = null;
  function showJump(secs) {
    if (jumpTimer && Math.sign(secs) !== Math.sign(jumpTotal)) jumpTotal = 0;
    jumpTotal += secs;
    jumpBubble.textContent = (jumpTotal > 0 ? '+' : '−') + Math.abs(jumpTotal) + 's';
    jumpBubble.className = 'jump-bubble show ' + (jumpTotal > 0 ? 'right' : 'left');
    clearTimeout(jumpTimer);
    jumpTimer = setTimeout(() => { jumpBubble.classList.remove('show'); jumpTotal = 0; jumpTimer = null; }, 800);
  }

  // Back / forward a few seconds (double-tap on the phone, ◀ ▶ on the TV remote)
  function jumpBy(secs) {
    if (!current) return false;
    const src = SOURCES[current.sourceKey || getSourceKey()];
    if (!canControl(src)) return false;
    window.vsSkipBy(secs);
    showJump(secs);
    return true;
  }

  // OK on the video (TV)
  function tvPlayerOk() {
    if (!current) return;
    if (skipBtn.classList.contains('visible')) { skipBtn.click(); return; }
    if (upNextEl.classList.contains('visible')) { goNext(true); return; }
    if (window.vsPlayPause(!isPlaying, false) !== 'none') return;
    if (HOOK && hookEnabled() && !hookReady) { hookSend('start'); return; }   // cover screen: press its play button
    try { playerFrame.focus(); } catch {}                                       // let the player have the remote
  }

  function tvKey(key, e) {
    const dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[key];
    const t = document.activeElement;
    const stop = () => { if (e) { e.preventDefault(); e.stopPropagation(); } };
    if ((key === 'Enter' || key === ' ') && t === frameWrap) { stop(); tvPlayerOk(); return; }
    if (!dir) return;
    if (t === frameWrap && (dir === 'left' || dir === 'right')) { stop(); jumpBy(dir === 'left' ? -10 : 10); return; }
    // Typing: ◀ ▶ move along the text until you reach the end of it
    if (t && t.tagName === 'INPUT' && (dir === 'left' || dir === 'right')) {
      const len = t.value.length;
      if (dir === 'left' && !(t.selectionStart === 0 && t.selectionEnd === 0)) return;
      if (dir === 'right' && !(t.selectionStart === len)) return;
    }
    stop();
    if (!navMove(dir) && dir === 'up' && !whoEl.classList.contains('open')) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.addEventListener('keydown', e => {
    if (!isTvLayout()) return;
    tvKey(e.key, e);
  }, true);

  // Going in or out of fullscreen on the TV: keep the highlight on the video
  document.addEventListener('fullscreenchange', () => {
    if (!isTvLayout() || !current || !frameWrap.dataset.nav) return;
    setTimeout(() => navFocus(frameWrap), 50);
  });

  // Arrow presses made while the video itself had the remote (the app's helper passes them on,
  // so the player doesn't use them for its own volume)
  function tvKeyFromPlayer(key) {
    if (!isTvLayout()) return;
    if (document.activeElement !== frameWrap) navFocus(frameWrap);
    tvKey(key, null);
  }

  // Where the highlight starts on the TV
  function tvStartFocus() {
    if (!isTvLayout()) return;
    if (whoEl.classList.contains('open')) {
      const tile = whoEl.querySelector('.who-tile.current') || whoEl.querySelector('.who-tile');
      if (tile) navFocus(tile);
      return;
    }
    const first = current ? frameWrap : (continueDiv.querySelector('.stream-btn') || queryInput);
    if (first && first !== queryInput) navFocus(first);
    else { queryInput.blur(); navFocus(searchBtn); }
  }

  // ============================================
  // SYNC BETWEEN DEVICES
  // Type the same profile phrase on each device. The phrase is scrambled (SHA-256)
  // into an address on MantleDB, a free no-sign-up JSON store, where a small note holds
  // your progress. Each device keeps its own copy too, so if the service is down
  // nothing breaks. Merging: for each show, whichever device saved it most recently wins.
  // ============================================
  const SYNC_BASE     = 'https://mantledb.sh/v2/';
  const MAX_SYNCED    = 60;                    // keep the note small
  const REMOVED_KEEP  = 90 * 24 * 3600 * 1000; // remember removals for 90 days
  const syncStatus    = document.getElementById('syncStatus');

  var syncUrl     = null;   // where this profile's note lives
  var syncTimer   = null;
  var syncRunning = false;
  var syncAgain   = false;
  var syncGen     = 0;      // goes up when you switch profile, so a sync for the old one is dropped

  function getProfile() {
    try { return localStorage.getItem('vs_profile') || ''; } catch { return ''; }
  }

  function setStatus(text, kind) {
    syncStatus.textContent = text;
    syncStatus.className = 'sync-status' + (kind ? ' ' + kind : '');
  }

  async function addressFor(profile) {
    const bytes = new TextEncoder().encode('vidsearch:' + profile);
    const hash  = await crypto.subtle.digest('SHA-256', bytes);
    const hex   = [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
    return `${SYNC_BASE}vs-${hex.slice(0, 32)}/progress`;
  }

  // Everything this device knows: { shows: { imdbId: record }, removed: { imdbId: time } }
  function collectLocal() {
    const shows = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith('vs_progress_')) continue;
        try {
          const rec = JSON.parse(localStorage.getItem(key));
          if (rec && rec.title && rec.tmdbId) shows[key.slice(12)] = rec;
        } catch {}
      }
    } catch {}
    return { shows, removed: getRemoved() };
  }

  function mergeNotes(a, b) {
    const shows = {}, removed = {};
    const now = Date.now();
    for (const src of [a, b]) {
      for (const [id, t] of Object.entries((src && src.removed) || {})) {
        if (now - t < REMOVED_KEEP && (!removed[id] || t > removed[id])) removed[id] = t;
      }
      for (const [id, rec] of Object.entries((src && src.shows) || {})) {
        if (!rec || !rec.title) continue;
        if (!shows[id] || (rec.t || 0) > (shows[id].t || 0)) shows[id] = rec;
      }
    }
    // A removal beats anything saved before it
    for (const id of Object.keys(shows)) {
      if (removed[id] && removed[id] >= (shows[id].t || 0)) delete shows[id];
    }
    // Keep only the most recent shows
    const keep = Object.entries(shows).sort((x, y) => (y[1].t || 0) - (x[1].t || 0)).slice(0, MAX_SYNCED);
    return { v: 1, shows: Object.fromEntries(keep), removed };
  }

  // Write the merged note into this device's storage. Returns true if anything changed.
  function applyLocal(note) {
    let changed = false;
    const local = collectLocal();
    for (const [id, rec] of Object.entries(note.shows)) {
      const mine = local.shows[id];
      if (!mine || (rec.t || 0) > (mine.t || 0)) {
        try { localStorage.setItem('vs_progress_' + id, JSON.stringify(rec)); changed = true; } catch {}
      }
    }
    for (const id of Object.keys(note.removed)) {
      if (local.shows[id] && !note.shows[id]) {
        try { localStorage.removeItem('vs_progress_' + id); changed = true; } catch {}
      }
    }
    setRemoved(note.removed);
    return changed;
  }

  // Compare two notes regardless of the order things are listed in
  function sameNote(a, b) {
    const canon = n => JSON.stringify({
      shows: Object.keys(n.shows).sort().map(k => [k, n.shows[k].t, n.shows[k].pos, n.shows[k].season, n.shows[k].episode]),
      removed: Object.keys(n.removed).sort().map(k => [k, n.removed[k]])
    });
    try { return canon(a) === canon(b); } catch { return false; }
  }

  async function readRemote() {
    const res = await Promise.race([
      fetch(syncUrl, { cache: 'no-store' }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
    ]);
    if (res.status === 404) return null;            // nothing saved yet
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (!text) return null;
    let data = JSON.parse(text);
    if (data && !data.shows && (data.value || data.data)) data = data.value || data.data;
    return data && data.shows ? data : null;
  }

  async function writeRemote(note, leaving) {
    const res = await fetch(syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(note),
      keepalive: !!leaving   // lets the save finish even if the page is closing
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  }

  async function syncNow(leaving) {
    if (!syncUrl) return;
    if (syncRunning) { syncAgain = true; return; }
    syncRunning = true;
    clearTimeout(syncTimer); syncTimer = null;
    const gen = syncGen;
    try {
      // Always read first, so we merge with the other devices rather than overwrite them
      const remote = await readRemote();
      if (gen !== syncGen) { syncRunning = false; return; }   // switched profile meanwhile
      const merged = mergeNotes(collectLocal(), remote);
      const changedHere = applyLocal(merged);
      if (!remote || !sameNote(merged, mergeNotes(remote, null))) {
        await writeRemote(merged, leaving);
      }
      if (changedHere) renderContinue();
      if (gen === syncGen) setStatus('History synced between devices · up to date ✓', 'ok');
    } catch {
      if (gen === syncGen) {
        setStatus("History sync · couldn't reach the sync service, will retry", 'err');
        scheduleSync(60000);
      }
    }
    syncRunning = false;
    if (syncAgain) { syncAgain = false; scheduleSync(1000); }
  }

  // Sync a little later (batches the frequent progress saves while watching)
  function scheduleSync(delay = 20000) {
    if (!syncUrl) return;
    if (syncTimer) {
      if (delay >= 20000) return;          // a sync is already on the way
      clearTimeout(syncTimer);
    }
    syncTimer = setTimeout(() => { syncTimer = null; syncNow(); }, delay);
  }

  async function startSync(profile) {
    syncUrl = profile ? await addressFor(profile) : null;
    if (!syncUrl) {
      setStatus('History is only saved on this device. Add a profile name (Switch / edit) to sync it between devices.');
      return;
    }
    setStatus('Syncing history…');
    syncNow();
  }


  // ============================================
  // WHO'S WATCHING (profiles)
  // Each profile has a name shown on screen, an icon, and (optionally) a private
  // profile name that keeps its history synced between devices. The profile list
  // lives on each device. Only the active profile's history is "live"; the others
  // are tucked away on this device until you switch to them.
  // ============================================
  const whoEl       = document.getElementById('who');
  const whoTiles    = document.getElementById('whoTiles');
  const whoTitle    = document.getElementById('whoTitle');
  const whoManage   = document.getElementById('whoManage');
  const whoClose    = document.getElementById('whoClose');
  const whoNow      = document.getElementById('whoNow');
  const profileChip = document.getElementById('profileChip');
  const editName    = document.getElementById('editName');
  const editCode    = document.getElementById('editCode');
  const editHeading = document.getElementById('editHeading');
  const editMsg     = document.getElementById('editMsg');
  const editDelete  = document.getElementById('editDelete');
  const iconPicker  = document.getElementById('iconPicker');

  const ICON_COLOURS = ['#e5383b', '#3a86ff', '#2a9d8f', '#f4a261', '#9b5de5', '#ef476f'];
  const ICON_EMOJI   = ['🦊', '🐼', '🐸', '🐙', '🦖', '🐱', '🐶', '🦁', '👽', '🤖', '🎮', '⚽'];

  let profiles = [];
  let editingId = null;      // profile being edited (or 'new')
  let editIcon = { icon: '', color: ICON_COLOURS[0] };
  let deleteArmed = false;

  function loadProfiles() {
    try {
      const list = JSON.parse(localStorage.getItem('vs_profiles') || 'null');
      if (Array.isArray(list) && list.length) return list;
    } catch {}
    // First time: turn the existing sync name (if any) into the first profile
    const code = getProfile();
    const first = {
      id: 'p' + Date.now().toString(36),
      name: code ? code.charAt(0).toUpperCase() + code.slice(1) : 'Me',
      code, icon: '', color: ICON_COLOURS[0]
    };
    try {
      localStorage.setItem('vs_profiles', JSON.stringify([first]));
      localStorage.setItem('vs_active', first.id);
    } catch {}
    return [first];
  }
  function saveProfiles() {
    try { localStorage.setItem('vs_profiles', JSON.stringify(profiles)); } catch {}
  }
  function activeProfile() {
    let id = '';
    try { id = localStorage.getItem('vs_active') || ''; } catch {}
    return profiles.find(p => p.id === id) || profiles[0];
  }

  function iconHtml(p) {
    const face = p.icon ? esc(p.icon) : esc((p.name || '?').trim().charAt(0).toUpperCase() || '?');
    return `<span class="who-icon" style="background:${esc(p.color || ICON_COLOURS[0])}">${face}</span>`;
  }

  function renderProfileUI() {
    const me = activeProfile();
    profileChip.innerHTML = iconHtml(me);
    profileChip.title = `${me.name}: switch profile`;
    whoNow.innerHTML = `${iconHtml(me)}<span>Watching as <b>${esc(me.name)}</b></span>`;
  }

  function renderWhoTiles() {
    const me = activeProfile();
    whoTiles.innerHTML = '';
    profiles.forEach(p => {
      const b = document.createElement('button');
      b.className = 'who-tile' + (p.id === me.id ? ' current' : '');
      b.innerHTML = `${iconHtml(p)}<span class="who-name">${esc(p.name)}</span>`;
      b.addEventListener('click', () => {
        if (whoEl.classList.contains('manage')) openEditor(p.id);
        else switchProfile(p.id);
      });
      whoTiles.appendChild(b);
    });
    if (profiles.length < 6) {
      const add = document.createElement('button');
      add.className = 'who-tile add';
      add.innerHTML = `<span class="who-icon">+</span><span class="who-name">Add profile</span>`;
      add.addEventListener('click', () => openEditor('new'));
      whoTiles.appendChild(add);
    }
  }

  // startup = shown when the app opens: you have to pick someone (no Close)
  function openWho(startup) {
    whoEl.classList.remove('manage', 'editing');
    whoEl.dataset.startup = startup ? '1' : '';
    whoClose.style.display = startup ? 'none' : '';
    whoManage.textContent = 'Edit profiles';
    whoTitle.textContent = "Who's watching?";
    renderWhoTiles();
    whoEl.classList.add('open');
    document.body.classList.add('who-open');
    tvStartFocus();
  }
  function closeWho() {
    whoEl.classList.remove('open', 'manage', 'editing');
    document.body.classList.remove('who-open');
    tvStartFocus();
  }

  whoManage.addEventListener('click', () => {
    const on = !whoEl.classList.contains('manage');
    whoEl.classList.toggle('manage', on);
    whoManage.textContent = on ? 'Done' : 'Edit profiles';
    whoTitle.textContent = on ? 'Edit profiles' : "Who's watching?";
  });
  whoClose.addEventListener('click', closeWho);
  profileChip.addEventListener('click', () => openWho(false));
  document.getElementById('whoSwitch').addEventListener('click', () => openWho(false));

  // ── Editing a profile ──
  function renderIconPicker() {
    const choices = [
      ...ICON_COLOURS.map(c => ({ icon: '', color: c })),
      ...ICON_EMOJI.map((e, i) => ({ icon: e, color: ICON_COLOURS[i % ICON_COLOURS.length] }))
    ];
    iconPicker.innerHTML = '';
    choices.forEach(ch => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'icon-pick' + (ch.icon === editIcon.icon && ch.color === editIcon.color ? ' selected' : '');
      b.innerHTML = iconHtml({ ...ch, name: editName.value || '?' });
      b.addEventListener('click', () => { editIcon = ch; renderIconPicker(); renderPreview(); });
      iconPicker.appendChild(b);
    });
  }
  function renderPreview() {
    const old = document.getElementById('editPreview');
    if (old) old.outerHTML = iconHtml({ ...editIcon, name: editName.value || '?' }).replace('class="who-icon"', 'id="editPreview" class="who-icon"');
  }
  editName.addEventListener('input', () => { renderPreview(); renderIconPicker(); });

  function openEditor(id) {
    editingId = id;
    deleteArmed = false;
    editDelete.textContent = 'Delete profile';
    const p = id === 'new' ? null : profiles.find(x => x.id === id);
    editHeading.textContent = p ? 'Edit profile' : 'Add profile';
    editName.value = p ? p.name : '';
    editCode.value = p ? p.code : '';
    editIcon = p ? { icon: p.icon || '', color: p.color || ICON_COLOURS[0] }
                 : { icon: '', color: ICON_COLOURS[profiles.length % ICON_COLOURS.length] };
    editMsg.textContent = '';
    editDelete.style.display = p && profiles.length > 1 ? '' : 'none';
    renderPreview();
    renderIconPicker();
    whoEl.classList.add('editing');
    if (isTvLayout()) navFocus(editName); else editName.focus();
  }
  function closeEditor() {
    whoEl.classList.remove('editing');
    editingId = null;
    renderWhoTiles();
    if (isTvLayout()) navFocus(whoTiles.querySelector('.who-tile'));
  }

  document.getElementById('editCancel').addEventListener('click', closeEditor);

  document.getElementById('editSave').addEventListener('click', () => {
    const name = editName.value.trim();
    const code = editCode.value.trim().toLowerCase();
    if (!name) { editMsg.textContent = 'Give the profile a name.'; return; }
    if (code && profiles.some(p => p.code === code && p.id !== editingId)) {
      editMsg.textContent = 'Another profile on this device already uses that profile name.';
      return;
    }
    const me = activeProfile();
    if (editingId === 'new') {
      profiles.push({ id: 'p' + Date.now().toString(36), name, code, icon: editIcon.icon, color: editIcon.color });
    } else {
      const p = profiles.find(x => x.id === editingId);
      if (!p) return closeEditor();
      const codeChanged = p.code !== code;
      Object.assign(p, { name, code, icon: editIcon.icon, color: editIcon.color });
      // Changed the profile name of whoever's watching now: sync with the new one
      if (codeChanged && p.id === me.id) {
        try { if (code) localStorage.setItem('vs_profile', code); else localStorage.removeItem('vs_profile'); } catch {}
        startSync(code);
      }
    }
    saveProfiles();
    renderProfileUI();
    closeEditor();
  });

  // Delete: press twice, so it can't happen by accident
  editDelete.addEventListener('click', async () => {
    if (!deleteArmed) {
      deleteArmed = true;
      editDelete.textContent = 'Press again to delete';
      return;
    }
    const id = editingId;
    if (!id || id === 'new' || profiles.length < 2) return;
    if (activeProfile().id === id) {
      await switchProfile(profiles.find(p => p.id !== id).id, true);
    }
    profiles = profiles.filter(p => p.id !== id);
    try { localStorage.removeItem('vs_bundle_' + id); } catch {}
    saveProfiles();
    renderProfileUI();
    closeEditor();
  });

  // ── Switching ──
  // Tuck the current profile's history away on this device, bring the other one's out
  function stashActiveHistory(id) {
    const mine = collectLocal();
    try { localStorage.setItem('vs_bundle_' + id, JSON.stringify(mine)); } catch {}
    const keys = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('vs_progress_')) keys.push(k);
      }
    } catch {}
    keys.forEach(k => { try { localStorage.removeItem(k); } catch {} });
    setRemoved({});
  }
  function restoreHistory(id) {
    let bundle = null;
    try { bundle = JSON.parse(localStorage.getItem('vs_bundle_' + id) || 'null'); } catch {}
    if (bundle) {
      for (const [imdbId, rec] of Object.entries(bundle.shows || {})) {
        try { localStorage.setItem('vs_progress_' + imdbId, JSON.stringify(rec)); } catch {}
      }
      setRemoved(bundle.removed || {});
    }
    try { localStorage.removeItem('vs_bundle_' + id); } catch {}
  }

  async function switchProfile(id, keepOpen) {
    const from = activeProfile();
    const to = profiles.find(p => p.id === id);
    if (!to) return;
    if (to.id === from.id) { if (!keepOpen) closeWho(); return; }
    if (current) closePlayer();                      // that was the other person's video
    // Save the leaving profile's latest progress to its sync first (gives up after 4 s)
    syncGen++;
    if (syncUrl) await Promise.race([syncNow(true), new Promise(r => setTimeout(r, 4000))]);
    syncGen++;                                       // anything still running belongs to the old profile
    clearTimeout(syncTimer); syncTimer = null;
    stashActiveHistory(from.id);
    restoreHistory(to.id);
    try {
      localStorage.setItem('vs_active', to.id);
      if (to.code) localStorage.setItem('vs_profile', to.code); else localStorage.removeItem('vs_profile');
    } catch {}
    renderProfileUI();
    renderContinue();
    startSync(to.code);
    if (!keepOpen) closeWho();
  }

  // Android app Back button: close the editor / profile screen first
  window.vsBack = function () {
    if (whoEl.classList.contains('editing')) { closeEditor(); return 'handled'; }
    if (whoEl.classList.contains('open') && !whoEl.dataset.startup) { closeWho(); return 'handled'; }
    return '';
  };

  // Catch up when you come back to the page; save when you leave it
  document.addEventListener('visibilitychange', () => {
    if (!syncUrl) return;
    if (document.visibilityState === 'visible') syncNow();
    else syncNow(true);
  });

  // Pause / episode end: save soon
  window.addEventListener('message', e => {
    if (!syncUrl || e.source !== playerFrame.contentWindow) return;
    const t = JSON.stringify(e.data || '');
    if (/pause|ended/i.test(t)) scheduleSync(3000);
  });

  // ── Starting up ──
  profiles = loadProfiles();
  {
    // Keep the active profile and its sync name in step
    const me = activeProfile();
    try { localStorage.setItem('vs_active', me.id); } catch {}
    if ((me.code || '') !== getProfile()) {
      try { if (me.code) localStorage.setItem('vs_profile', me.code); else localStorage.removeItem('vs_profile'); } catch {}
    }
  }
  renderProfileUI();
  startSync(getProfile());

  // Show the Continue watching row on page load (in the side panel on a TV)
  applyTvLayout();
  renderContinue();
  if (profiles.length > 1) openWho(true);
  else tvStartFocus();

  // Switch on the app helper (sw.js) so the site can be installed as an app
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
