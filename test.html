  // Makes the whole video area fullscreen (video + Up next box), not just the video,
  // so the box stays visible and you stay fullscreen when the next episode loads.
  const frameWrap = document.querySelector('.player-frame');

  // Stay in fullscreen: when you tap something in the player area that reloads the player
  // (Skip, ⟳, Next/Prev, episode drop-downs, source buttons, Up next), the app can drop out of
  // fullscreen. If that happens within a few seconds of the tap, go straight back in — the
  // tap still counts as permission to go fullscreen.
  let keepFsUntil = 0;
  // Backup for taps inside the player (the app's helper reports them): if something knocks
  // you out of fullscreen right after you touch the video, and it wasn't you leaving on
  // purpose (✕, Back, the fullscreen button), go straight back in.
  var lastPlayerTap = 0, fsLeaveAt = 0, inOurFs = false;
  var adReloadAt = 0;
  // The app's floating window (picture-in-picture): the app tells us when it opens/closes.
  // While it's open the player's own buttons and bars are hidden, so you just see the video.
  var pipMode = false, pipEndedAt = 0;
  window.vsPipMode = function (on) {
    on = !!on;
    if (pipMode && !on) pipEndedAt = Date.now();
    pipMode = on;
    hookSend('pip', { on });
    if (on) [800, 2500].forEach(ms => setTimeout(() => { if (pipMode) hookSend('pip', { on: true }); }, ms));
    return 'ok';
  };
  document.addEventListener('fullscreenchange', () => {
    const was = inOurFs;
    inOurFs = document.fullscreenElement === frameWrap;
    if (was && !document.fullscreenElement && current &&
        Date.now() - lastPlayerTap < 2500 && Date.now() - fsLeaveAt > 1500) {
      frameWrap.requestFullscreen().catch(() => {});
    }
  });
  function armKeepFullscreen(e) {
    // Not for the buttons whose job is to leave fullscreen (fullscreen toggle, close)
    if (e && e.target && e.target.closest && e.target.closest('#fsBtn, #closeBtn')) { keepFsUntil = 0; return; }
    if (document.fullscreenElement === frameWrap) keepFsUntil = Date.now() + 4000;
  }
  const playerArea = document.getElementById('player');
  playerArea.addEventListener('click', armKeepFullscreen, true);
  playerArea.addEventListener('change', armKeepFullscreen, true);
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && Date.now() < keepFsUntil) {
      keepFsUntil = 0;
      frameWrap.requestFullscreen().catch(() => {});
    }
  });

  // On a TV: stretch the player over the screen instead of Android's fullscreen
  function setTvFull(on) {
    if (!on) endPlayerMenu();
    frameWrap.classList.toggle('tv-full', on);
    document.body.classList.toggle('tv-full-on', on);
    fitTvPlayer();
    if (frameWrap.dataset.nav) navFocus(frameWrap);
  }
  function inAnyFullscreen() {
    return !!document.fullscreenElement || frameWrap.classList.contains('tv-full');
  }

  async function toggleFullscreen() {
    if (isTvLayout() || frameWrap.classList.contains('tv-full')) {
      if (inAnyFullscreen()) await exitAllFullscreen();
      else setTvFull(true);
      return;
    }
    try {
      if (document.fullscreenElement) {
        await exitAllFullscreen();
      } else {
        await frameWrap.requestFullscreen();
        // On phones, turn sideways like a normal video player
        try { await screen.orientation.lock('landscape'); } catch {}
      }
    } catch {}
  }

  async function exitAllFullscreen() {
    fsLeaveAt = Date.now();                 // leaving on purpose: don't put you back in
    if (frameWrap.classList.contains('tv-full')) setTvFull(false);
    for (let i = 0; i < 3 && document.fullscreenElement; i++) {
      try { await document.exitFullscreen(); } catch { break; }
    }
  }

  let wasOurFullscreen = false;
  let swapping = false;

  // Did a swap fail on this device before? Then don't try again (stay with the player's fullscreen).
  function swapDisabled() {
    try { return localStorage.getItem('vs_fs_swap_failed2') === '1'; } catch { return false; }
  }

  // The player's own fullscreen only enlarges the video, hiding the Up next box.
  // Swap it for ours (video + box). Only tried when the browser confirms you just tapped,
  // because browsers refuse fullscreen otherwise.
  async function swapToOurFullscreen() {
    if (swapping || swapDisabled()) return;
    // If the browser can tell us you didn't just tap, don't try (it would be refused).
    // If it can't tell us at all, try anyway — a refusal is remembered below.
    const ua = navigator.userActivation;
    if (ua && !ua.isActive) return;

    swapping = true;
    try {
      await document.exitFullscreen();
      await frameWrap.requestFullscreen();
      try { await screen.orientation.lock('landscape'); } catch {}
    } catch {
      try { localStorage.setItem('vs_fs_swap_failed2', '1'); } catch {}
    }
    swapping = false;
    wasOurFullscreen = document.fullscreenElement === frameWrap;
  }

  document.addEventListener('fullscreenchange', () => {
    const el = document.fullscreenElement;
    if (swapping) return;

    // In our fullscreen, the player's own fullscreen button tries to go "more" fullscreen.
    // Treat that tap as "get me out" and leave fullscreen completely.
    if (wasOurFullscreen && el === playerFrame) {
      wasOurFullscreen = false;
      exitAllFullscreen();
      return;
    }

    // The player's own fullscreen button was used: switch to ours so Up next can show
    if (el === playerFrame) {
      swapToOurFullscreen();
      return;
    }

    wasOurFullscreen = el === frameWrap;
    if (!el) {
      try { screen.orientation.unlock(); } catch {}
    }
  });

  function closePlayer() {
    cancelUpNext();
    exitAllFullscreen();
    playerFrame.src = 'about:blank';
    clearLoadTimers(); hideLoadCover(true);
    playerEl.classList.remove('visible');
    document.body.classList.remove('playing', 'watching');
    current = null;
  }

  prevBtn.addEventListener('click', () => step(-1));
  nextBtn.addEventListener('click', () => step(1));
  document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);

  // Fire TV remote (the app passes these on): ≡ = fullscreen on/off.
  // ⏪ ⏩ = previous / next episode for shows (◀ ▶ already do 10 seconds); films have no
  // episodes, so there they still jump 10 seconds.
  window.vsToggleFullscreen = function () { if (current) toggleFullscreen(); };
  window.vsJump = function (secs) {
    secs = Number(secs) || 0;
    if (current && !current.isMovie && secs) { remoteEpisode(secs > 0 ? 1 : -1); return 'ok'; }
    return jumpBy(secs) ? 'ok' : 'none';
  };
  async function remoteEpisode(dir) {
    const playing = current;
    const seasons = await getSeasons(playing.tmdbId);
    if (current !== playing) return;
    const target = neighbour(seasons, playing.season, playing.episode, dir);
    // Say what's happening in the little bubble, so a stray press isn't a mystery
    jumpBubble.textContent = target ? `${dir > 0 ? 'Next' : 'Previous'}: S${target.season} · E${target.episode}`
                                    : (dir > 0 ? 'No next episode' : 'This is the first episode');
    jumpBubble.className = 'jump-bubble show ' + (dir > 0 ? 'right' : 'left');
    clearTimeout(jumpTimer);
    jumpTimer = setTimeout(() => { jumpBubble.classList.remove('show'); jumpTotal = 0; jumpTimer = null; }, 1500);
    if (target) step(dir);
  }

  // The Android app's Back button is about to take you out of fullscreen (on purpose)
  window.vsLeavingFullscreen = function () { fsLeaveAt = Date.now(); };

  // For the Android app's picture-in-picture play/pause button.
  // vsPipState(): '0' = nothing playing, otherwise 3 digits: open, playing, can-control
  window.vsPipState = function () {
    if (!current) return '0';
    const src = SOURCES[current.sourceKey || getSourceKey()];
    return '1' + (isPlaying ? '1' : '0') + (canControl(src) ? '1' : '0');
  };

  // Reloading the player to resume only works for players that start by themselves
  // (VidNest, VidRift). vidsrc reloads to its cover picture and waits for a tap, so it's
  // resumed with a plain "play" instead.
  // Where to pick up when the player is reloaded: where it was, or your saved spot if
  // that's further on (the player may have slipped back by itself while paused)
  function resumeHere() {
    const saved = getProgress(current.imdbId);
    return Math.max(Math.floor(lastPos), resumePoint(saved, current.season, current.episode));
  }
  function resumeByReload() { return (current.sourceKey || getSourceKey()) !== 'vidsrc'; }

  window.vsPipToggle = function () {
    if (!current) return 'none';
    const src = SOURCES[current.sourceKey || getSourceKey()];
    if (!canControl(src)) return 'none';   // e.g. vidsrc without the helper
    if (isPlaying) {
      lastPos = estimatedPos(); lastPosAt = Date.now();
      ctlPause(src);
      isPlaying = false;
      return 'paused';
    }
    // Play: reload the player where it was paused (like the ⟳ button). Android often takes
    // a paused video's picture away in the floating window, and a plain "play" leaves it black.
    if (resumeByReload()) play({ ...current, startAt: resumeHere(), autoplay: true });
    else ctlPlay(src);
    isPlaying = true;
    lastPosAt = Date.now();
    return 'playing';
  };

  // For headphone buttons (via the Android app): play or pause.
  // reload = true when in the floating window, where a plain "play" can leave the picture black.
  window.vsPlayPause = function (wantPlay, reload) {
    if (!current) return 'none';
    const src = SOURCES[current.sourceKey || getSourceKey()];
    if (!canControl(src)) return 'none';
    if (!wantPlay) {
      if (isPlaying) { lastPos = estimatedPos(); lastPosAt = Date.now(); ctlPause(src); isPlaying = false; }
      return 'paused';
    }
    if (isPlaying) return 'playing';
    if (reload && resumeByReload()) play({ ...current, startAt: resumeHere(), autoplay: true });
    else ctlPlay(src);
    isPlaying = true;
    lastPosAt = Date.now();
    return 'playing';
  };

  // For the Android app's "now playing" card in the notification shade:
  // title, episode, where you are and how long it is (seconds)
  window.vsNowPlaying = function () {
    if (!current) return '';
    const saved = getProgress(current.imdbId);
    const sameEp = saved && (saved.season ?? null) === (current.season ?? null) &&
                   (saved.episode ?? null) === (current.episode ?? null);
    return JSON.stringify({
      t: npTitle.textContent || current.title || '',
      e: npEp.textContent || '',
      pos: Math.max(0, Math.floor(estimatedPos())),
      dur: sameEp && saved.dur > 0 ? Math.floor(saved.dur) : 0,
      next: hasNextEp()
    });
  };

  function hasNextEp() {
    return !!current && !current.isMovie && !nextBtn.disabled && !nextBtn.classList.contains('hidden');
  }

  // The card's ⏪ / ⏩ buttons: back or forward 10 seconds
  window.vsSkipBy = function (secs) {
    if (!current) return 'none';
    return window.vsSeekTo(estimatedPos() + (Number(secs) || 0));
  };

  // The card's ⏭ button: next episode (there's deliberately no "previous")
  window.vsNextEp = function () {
    if (!hasNextEp()) return 'none';
    step(1);
    return 'ok';
  };

  // Dragging the progress bar on that card
  window.vsSeekTo = function (t) {
    if (!current) return 'none';
    const src = SOURCES[current.sourceKey || getSourceKey()];
    t = Math.max(0, Math.floor(Number(t) || 0));
    youMovedIt();
    if (!ctlSeek(src, t)) play({ ...current, startAt: t, autoplay: true });
    lastPos = t; lastPosAt = Date.now();
    return 'ok';
  };

  // Reload button: reloads only the player, at the point you were at.
  // Fixes a black/frozen video (e.g. after switching away from the app or tab).
  document.getElementById('reloadBtn').addEventListener('click', async () => {
    if (!current) return;
    await domainReady;
    play({ ...current, startAt: Math.floor(estimatedPos()), autoplay: true });
  });
  closeBtn.addEventListener('click', closePlayer);

  // Keyboard shortcuts — only when the player is open and you're not typing
  document.addEventListener('keydown', e => {
    if (!current) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;

    const k = e.key;
    if (k === 'n' || k === 'N' || k === 'MediaTrackNext')     { e.preventDefault(); step(1); }
    if (k === 'b' || k === 'B' || k === 'MediaTrackPrevious') { e.preventDefault(); step(-1); }  });

  // ── Search ───────────────────────────────────────────────────
  searchBtn.addEventListener('click', doSearch);
  queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  let searchId = 0; // stops a slow old search from overwriting a newer one

  async function doSearch() {
    const query = queryInput.value.trim();
    if (!query) return;

    // Searching while something's playing = you want something else.
    // Close the player (your spot is saved in Continue watching) so results are at the top.
    if (current) closePlayer();
    document.body.classList.add('playing'); // compact header so results sit near the top

    const myId = ++searchId;
    resultsDiv.innerHTML = '';
    statusDiv.textContent = 'Searching...';

    try {
      const data = await tmdb('search/multi', `&query=${encodeURIComponent(query)}&page=1`);
      if (myId !== searchId) return;

      const results = (data.results || [])
        .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
        .slice(0, 5);

      if (results.length === 0) {
        statusDiv.textContent = 'No results found.';
        return;
      }

      statusDiv.textContent = `${results.length} result${results.length > 1 ? 's' : ''}`;
      results.forEach(item => renderCard(item));

    } catch (err) {
      if (myId === searchId) statusDiv.textContent = 'Something went wrong. Check your connection.';
    }
  }

  // ── Render card ──────────────────────────────────────────────
  // A search result. Tapping it (or Open) opens its show page, with the episodes,
  // the Play / Resume button and My List.
  function renderCard(item) {
    const isMovie = item.media_type === 'movie';
    const title   = isMovie ? item.title : item.name;
    const year    = isMovie
      ? (item.release_date || '').slice(0, 4)
      : (item.first_air_date || '').slice(0, 4);
    const type    = isMovie ? 'Movie' : 'TV Series';
    const poster  = item.poster_path
      ? `<img class="result-poster" src="https://image.tmdb.org/t/p/w92${item.poster_path}" alt="${esc(title)}">`
      : `<div class="no-poster">🎬</div>`;

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="card-main">
        ${poster}
        <div class="result-info">
          <div class="result-title">${esc(title)}</div>
          <div class="result-meta">${type}${year ? ' · ' + year : ''}</div>
        </div>
        <button class="stream-btn">Open</button>
      </div>`;
    const open = () => openDetails(item.id, isMovie);
    card.querySelector('.stream-btn').addEventListener('click', open);
    card.querySelectorAll('.result-poster, .no-poster, .result-info').forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', open);
    });
    resultsDiv.appendChild(card);
  }

  // ── Fetch IMDB ID ────────────────────────────────────────────
  async function fetchImdbId(tmdbId, isMovie) {
    if (!isMovie) return (await getShow(tmdbId)).imdbId;
    const data = await tmdb(`movie/${tmdbId}/external_ids`);
    return data.imdb_id || null;
  }

  // ── Open stream (now plays in the built-in player) ───────────
  async function openStream(item, isMovie, season, episode, title, cachedImdbId) {
    statusDiv.textContent = 'Loading...';
    await domainReady; // ensure domain check has finished before building URL

    try {
      const imdbId = cachedImdbId || await fetchImdbId(item.id, isMovie);

      if (!imdbId) {
        statusDiv.textContent = 'No IMDB ID found for this title.';
        return;
      }

      statusDiv.textContent = '';

      play({
        tmdbId: item.id,
        imdbId,
        title,
        poster: item.poster_path,
        isMovie,
        season,
        episode,
        startAt: resumePoint(getProgress(imdbId), season, episode)
      });

    } catch (err) {
      statusDiv.textContent = 'Failed to open stream. Try again.';
    }
  }


  // ============================================
  // BROWSING: home screen rows, show page, My List, More like this
  // All the information comes from TMDB (the same free film database used for search).
  // ============================================
  const homeEl    = document.getElementById('home');
  const detailsEl = document.getElementById('details');
  const IMG       = 'https://image.tmdb.org/t/p/';

  // ── My List (per profile; synced along with your history) ──
  // Stored as { "t1396": { id, isMovie, title, poster, year, t } }. Taking something off
  // leaves a { gone: true, t } marker for a while, so the removal syncs to other devices.
  function getMyList() {
    try { return JSON.parse(localStorage.getItem('vs_mylist') || '{}') || {}; } catch { return {}; }
  }
  function setMyList(obj) {
    try { localStorage.setItem('vs_mylist', JSON.stringify(obj)); } catch {}
  }
  function listKey(isMovie, id) { return (isMovie ? 'm' : 't') + id; }
  function inMyList(isMovie, id) {
    const r = getMyList()[listKey(isMovie, id)];
    return !!(r && !r.gone);
  }
  function myListItems() {
    return Object.values(getMyList()).filter(r => r && !r.gone && r.id).sort((a, b) => (b.t || 0) - (a.t || 0));
  }
  // Watched to the end → off My List:
  //   a film, as soon as you reach the end credits;
  //   a show, only once it's finished for good (ended or cancelled) and you've reached the
  //   end of its very last episode, so shows still running stay on your list.
  // (Very short lengths are ignored, in case a player reports a wrong one.)
  async function doneWatching(rec) {
    if (!rec || !rec.tmdbId || !inMyList(rec.isMovie, rec.tmdbId)) return;
    if (rec.isMovie) {
      if (rec.dur < 1800) return;
    } else {
      if (rec.dur < 600) return;
      try {
        const show = await getShow(rec.tmdbId);
        if (!show.ended || neighbour(show.seasons, rec.season, rec.episode, 1)) return;
      } catch { return; }
    }
    if (!inMyList(rec.isMovie, rec.tmdbId)) return;
    const list = getMyList();
    list[listKey(rec.isMovie, rec.tmdbId)] = { gone: true, t: Date.now() };
    setMyList(list);
    renderMyListRow();
    if (typeof scheduleSync === 'function') scheduleSync(1000);
  }

  function toggleMyList(it) {
    const list = getMyList();
    const key = listKey(it.isMovie, it.id);
    const adding = !inMyList(it.isMovie, it.id);
    list[key] = adding
      ? { id: it.id, isMovie: !!it.isMovie, title: it.title, poster: it.poster || null, year: it.year || '', t: Date.now() }
      : { gone: true, t: Date.now() };
    setMyList(list);
    renderMyListRow();
    if (typeof scheduleSync === 'function') scheduleSync(1000);
    return adding;
  }

  // ── Poster tiles and rows ──
  // Turns a TMDB result into what a tile needs
  function fromTmdb(r, isMovie) {
    if (isMovie === undefined) isMovie = r.media_type === 'movie';
    const date = (isMovie ? r.release_date : r.first_air_date) || '';
    return {
      id: r.id, isMovie,
      title: isMovie ? r.title : r.name,
      poster: r.poster_path || null,
      year: date.slice(0, 4),
      date
    };
  }

  // Out already? (Upcoming films and shows can't be watched yet, so they're left out of
  // the rows and More like this.)
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function isOut(it) { return !!(it && it.date && it.date <= todayISO()); }

  function makeTile(it) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile';
    b.innerHTML = (it.poster
        ? `<img class="tile-poster" loading="lazy" src="${IMG}w185${esc(it.poster)}" alt="">`
        : `<span class="no-art">${esc(it.title)}</span>`) +
      `<span class="tile-title">${esc(it.title)}</span>`;
    b.title = it.title + (it.year ? ` (${it.year})` : '');
    b.addEventListener('click', () => openDetails(it.id, it.isMovie));
    return b;
  }

  function makeRow(label, items, id) {
    const sec = document.createElement('section');
    sec.className = 'row';
    if (id) sec.id = id;
    sec.innerHTML = `<div class="section-label">${esc(label)}</div>
      <div class="row-wrap">
        <button type="button" class="row-btn prev end" tabindex="-1" aria-label="Scroll left">‹</button>
        <div class="row-track"></div>
        <button type="button" class="row-btn next" tabindex="-1" aria-label="Scroll right">›</button>
      </div>`;
    const track = sec.querySelector('.row-track');
    const prev = sec.querySelector('.row-btn.prev'), next = sec.querySelector('.row-btn.next');
    // Hide ‹ at the start of the row and › at the end
    const ends = () => {
      prev.classList.toggle('end', track.scrollLeft < 4);
      next.classList.toggle('end', track.scrollLeft + track.clientWidth >= track.scrollWidth - 4);
    };
    prev.addEventListener('click', () => track.scrollBy({ left: -track.clientWidth * 0.85, behavior: 'smooth' }));
    next.addEventListener('click', () => track.scrollBy({ left: track.clientWidth * 0.85, behavior: 'smooth' }));
    track.addEventListener('scroll', ends, { passive: true });
    sec.addEventListener('mouseenter', ends);
    items.forEach(it => track.appendChild(makeTile(it)));
    return sec;
  }

  // The rows on the home screen. Each is one small request, saved on the device for 3 hours.
  // Genre rows: popular, well-rated titles that are already out. Kids, family and
  // animation are left out of all of them.
  const NO_KIDS = '&without_genres=16,10751,10762&sort_by=popularity.desc&vote_count.gte=150';
  function genreRow(label, isMovie, genres) {
    const today = new Date().toISOString().slice(0, 10);
    return {
      label, isMovie, path: `discover/${isMovie ? 'movie' : 'tv'}`,
      query: `&with_genres=${genres}${NO_KIDS}&${isMovie ? 'release_date' : 'first_air_date'}.lte=${today}`
    };
  }

  const HOME_ROWS = [
    { label: 'Trending this week', path: 'trending/all/week' },
    { label: 'Popular shows',      path: 'tv/popular',      isMovie: false },
    { label: 'Top rated films',    path: 'movie/top_rated', isMovie: true },
    genreRow('Action & adventure films', true,  '28|12'),
    genreRow('Comedy films',             true,  '35'),
    genreRow('Comedy shows',             false, '35'),
    genreRow('Crime shows',              false, '80'),
    genreRow('Drama shows',              false, '18'),
    genreRow('Sci-fi & fantasy shows',   false, '10765'),
    genreRow('Sci-fi films',             true,  '878'),
    genreRow('Horror films',             true,  '27'),
    genreRow('Thrillers',                true,  '53'),
    genreRow('Documentaries',            true,  '99')
  ];
  const ROW_KEEP = 3 * 3600 * 1000;

  async function rowItems(row) {
    const key = 'vs_cache2_' + (row.path + (row.query ? '_' + row.label : '')).replace(/\W/g, '_');
    try {
      const c = JSON.parse(localStorage.getItem(key) || 'null');
      if (c && Date.now() - c.at < ROW_KEEP && Array.isArray(c.items) && c.items.length) return c.items.filter(isOut);
    } catch {}
    const data = await tmdb(row.path, row.query || '');
    const items = (data.results || [])
      .filter(r => row.isMovie !== undefined || r.media_type === 'movie' || r.media_type === 'tv')
      .filter(r => r.poster_path)
      .map(r => fromTmdb(r, row.isMovie))
      .filter(isOut)
      .slice(0, 20);
    try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), items })); } catch {}
    return items;
  }

  // Shuffle: a random order for My List, only until the page/app is next opened, so the
  // usual order (newest added first) is always what you start with.
  let listShuffle = null;   // title → its random place, while shuffled
  function renderMyListRow(fromStart) {
    const old = document.getElementById('rowMyList');
    let items = myListItems();
    if (!items.length) { if (old) old.remove(); return; }
    if (listShuffle) {
      const place = it => {
        const k = listKey(it.isMovie, it.id);
        if (!(k in listShuffle)) listShuffle[k] = Math.random();
        return listShuffle[k];
      };
      items = items.slice().sort((a, b) => place(a) - place(b));
    }
    const sec = makeRow('My List', items, 'rowMyList');
    // Shuffle buttons (only worth having with a few titles on the list)
    if (items.length > 3) {
      const box = document.createElement('span');
      box.className = 'list-order';
      const addBtn = (text, label, fn) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = text; b.setAttribute('aria-label', label);
        b.addEventListener('click', () => {
          fn();
          renderMyListRow(true);
          const again = document.querySelector('#rowMyList .list-order button');
          if (again && document.activeElement === document.body) { try { again.focus({ preventScroll: true }); } catch { again.focus(); } }
        });
        box.appendChild(b);
      };
      if (!listShuffle) {
        addBtn('🔀 Shuffle', 'Shuffle My List', () => { listShuffle = {}; });
      } else {
        addBtn('🔀 Shuffle again', 'Shuffle My List again', () => { listShuffle = {}; });
        addBtn('↺ Original order', 'Put My List back in its usual order', () => { listShuffle = null; });
      }
      sec.querySelector('.section-label').appendChild(box);
    }
    // A ✕ on each poster takes it off the list (same as the My List button on its page)
    sec.querySelectorAll('.row-track .tile').forEach((tile, i) => {
      const x = document.createElement('span');
      x.className = 'tile-x';
      x.setAttribute('role', 'button');
      x.setAttribute('aria-label', 'Remove from My List');
      x.title = 'Remove from My List';
      x.textContent = '✕';
      x.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        toggleMyList(items[i]);
      });
      tile.appendChild(x);
    });
    // Keep the row where it was scrolled to when it's redrawn
    const was = !fromStart && old && old.querySelector('.row-track');
    if (was) { const left = was.scrollLeft; requestAnimationFrame(() => { sec.querySelector('.row-track').scrollLeft = left; }); }
    if (old) old.replaceWith(sec); else homeEl.prepend(sec);
  }

  // Rows further down only load when you scroll (or move the highlight) close to them
  const rowWatcher = 'IntersectionObserver' in window
    ? new IntersectionObserver(entries => entries.forEach(en => {
        if (en.isIntersecting) { rowWatcher.unobserve(en.target); en.target._load && en.target._load(); }
      }), { rootMargin: '900px 0px' })
    : null;

  let homeBuilt = false, homeFailed = false;
  function renderHome() {
    renderMyListRow();
    renderBecause();
    if (homeBuilt && !homeFailed) return;
    homeBuilt = true; homeFailed = false;
    homeEl.querySelectorAll('.row:not(#rowMyList):not(.because)').forEach(el => el.remove());
    HOME_ROWS.forEach((row, i) => {
      const sec = makeRow(row.label, []);
      const track = sec.querySelector('.row-track');
      track.innerHTML = '<div class="row-msg">Loading…</div>';
      homeEl.appendChild(sec);
      sec._load = () => rowItems(row).then(items => {
        if (!items.length) { sec.remove(); return; }
        track.innerHTML = '';
        items.forEach(it => track.appendChild(makeTile(it)));
      }).catch(() => {
        homeFailed = true;           // try again next time you go home
        track.innerHTML = `<div class="row-msg">Couldn't load this row. Check your connection.</div>`;
      });
      if (i < 3 || !rowWatcher) sec._load();
      else rowWatcher.observe(sec);
    });
  }

  // ── "Because you watched …" ──
  // Suggestions based on the two things this profile watched most recently (TMDB's
  // recommendations for each, saved for 6 hours). Things you've already watched are left out.
  const RECS_KEEP = 6 * 3600 * 1000;
  async function recsFor(id, isMovie) {
    const key = 'vs_recs_' + (isMovie ? 'm' : 't') + id;
    try {
      const c = JSON.parse(localStorage.getItem(key) || 'null');
      if (c && Date.now() - c.at < RECS_KEEP && Array.isArray(c.items)) return c.items.filter(isOut);
    } catch {}
    const data = await tmdb(`${isMovie ? 'movie' : 'tv'}/${id}/recommendations`);
    const items = (data.results || [])
      .filter(r => r.poster_path)
      .map(r => fromTmdb(r, r.media_type ? r.media_type === 'movie' : isMovie))
      .filter(isOut)
      .slice(0, 20);
    try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), items })); } catch {}
    return items;
  }

  let becauseReq = 0;
  function renderBecause() {
    const myReq = ++becauseReq;
    const history = getAllProgress().filter(p => p.tmdbId);
    const seen = new Set(history.map(p => (p.isMovie ? 'm' : 't') + p.tmdbId));
    const picks = history.slice(0, 2);
    const keepIds = new Set(picks.map(p => 'because-' + (p.isMovie ? 'm' : 't') + p.tmdbId));
    homeEl.querySelectorAll('.row.because').forEach(el => { if (!keepIds.has(el.id)) el.remove(); });
    picks.forEach((p, i) => {
      const id = 'because-' + (p.isMovie ? 'm' : 't') + p.tmdbId;
      recsFor(p.tmdbId, !!p.isMovie).then(items => {
        if (myReq !== becauseReq) return;
        items = items.filter(it => !seen.has((it.isMovie ? 'm' : 't') + it.id));
        const old = document.getElementById(id);
        if (items.length < 3) { if (old) old.remove(); return; }
        const sec = makeRow('Because you watched ' + p.title, items, id);
        sec.classList.add('because');
        sec.dataset.order = i;
        if (old) { old.replaceWith(sec); return; }
        // Straight after My List, in order (most recent first)
        const later = [...homeEl.querySelectorAll('.row.because')].find(r => +r.dataset.order > i);
        const firstOther = homeEl.querySelector('.row:not(#rowMyList):not(.because)');
        homeEl.insertBefore(sec, later || firstOther || null);
      }).catch(() => {});
    });
  }

  // ── Show page ──
  let detailsReq = 0;
  let detailsReturn = null;          // what was highlighted before (TV), to go back to
  let detailsStack = [];             // pages opened on top of each other: { id, isMovie } or { person }
  const seasonCache = {};

  function closeDetails(backToWhereYouWere) {
    detailsReq++;
    detailsStack = [];
    detailsEl.classList.remove('open');
    document.body.classList.remove('details-open');
    if (isTvLayout()) {
      if (backToWhereYouWere !== false && detailsReturn && detailsReturn.isConnected) navFocus(detailsReturn);
      else tvStartFocus();
    } else if (backToWhereYouWere !== false && detailsReturn && detailsReturn.isConnected && detailsReturn.closest('.row-track')) {
      try { detailsReturn.focus({ preventScroll: true }); } catch {}
    }
    detailsReturn = null;
  }

  function detailsMsg(text) {
    const body = detailsEl.querySelector('.d-body');
    if (body) body.innerHTML = `<div class="d-msg">${esc(text)}</div>`;
  }

  // Back (remote / phone / Esc) on a show or actor page: the page before, or close
  function detailsBack() {
    if (detailsStack.length > 1) {
      detailsStack.pop();
      const prev = detailsStack[detailsStack.length - 1];
      if (prev.person) loadPerson(prev.person); else loadTitle(prev.id, prev.isMovie);
      return;
    }
    closeDetails();
  }

  // An empty page with a ✕ and "Loading…", while the information arrives
  function detailsShell(short) {
    if (!detailsEl.classList.contains('open')) detailsReturn = document.activeElement;
    detailsEl.innerHTML = `<div class="d-hero${short ? ' short' : ''}"><button class="d-close" aria-label="Close">✕</button></div>
      <div class="d-body"><div class="d-msg">Loading…</div></div>`;
    detailsEl.querySelector('.d-close').addEventListener('click', () => closeDetails());
    detailsEl.classList.add('open');
    document.body.classList.add('details-open');
    detailsEl.scrollTop = 0;
    if (isTvLayout()) navFocus(detailsEl.querySelector('.d-close'));
    else try { detailsEl.querySelector('.d-close').focus({ preventScroll: true }); } catch {}
  }

  function openDetails(id, isMovie) {
    if (!detailsEl.classList.contains('open')) detailsStack = [];
    detailsStack.push({ id, isMovie });
    return loadTitle(id, isMovie);
  }

  async function loadTitle(id, isMovie) {
    const myReq = ++detailsReq;
    detailsShell(false);

    let data;
    try {
      data = await tmdb(`${isMovie ? 'movie' : 'tv'}/${id}`,
        `&append_to_response=external_ids,recommendations,${isMovie ? 'credits' : 'aggregate_credits'}`);
    } catch {
      if (myReq === detailsReq) detailsMsg("Couldn't load this. Check your connection and try again.");
      return;
    }
    if (myReq !== detailsReq) return;
    const imdbId = (data.external_ids && data.external_ids.imdb_id) || data.imdb_id || null;
    // Share the show info with the player (saves it asking again)
    if (!isMovie) showCache[id] = Promise.resolve({ seasons: parseSeasons(data), imdbId });
    renderDetails(data, id, isMovie, imdbId, myReq);
  }

  // What the big button does: resume, the next episode, or the start
  function playTarget(isMovie, imdbId, seasons) {
    const saved = imdbId ? getProgress(imdbId) : null;
    if (isMovie) {
      const resume = saved && !isFinished(saved) && saved.pos > 10;
      return { label: resume ? 'Resume' : 'Play', season: null, episode: null };
    }
    if (!seasons.length) return null;
    if (saved && saved.season != null && seasons.some(s => s.n === saved.season)) {
      if (!isFinished(saved)) return { label: `Resume S${saved.season} E${saved.episode}`, season: saved.season, episode: saved.episode };
      const nx = neighbour(seasons, saved.season, saved.episode, 1);
      if (nx) return { label: `Play S${nx.season} E${nx.episode}`, season: nx.season, episode: nx.episode };
    }
    return { label: `Play S${seasons[0].n} E1`, season: seasons[0].n, episode: 1 };
  }

  async function playFrom(it, imdbId, season, episode) {
    if (!imdbId) { detailsMsgInline("This one can't be played: it has no IMDb ID."); return; }
    closeDetails(false);
    await openStream({ id: it.id, poster_path: it.poster }, it.isMovie, season, episode, it.title, imdbId);
  }
  function detailsMsgInline(text) {
    const m = detailsEl.querySelector('.d-actions-msg');
    if (m) m.textContent = text;
  }

  // IMDb, Rotten Tomatoes and Metacritic scores from OMDb. Saved for a week per title; a
  // failed lookup (e.g. the day's 1,000 used up) is retried after an hour.
  async function omdbRatings(imdbId) {
    const key = 'vs_omdb_' + imdbId;
    try {
      const c = JSON.parse(localStorage.getItem(key) || 'null');
      if (c && Date.now() - c.at < (c.ok ? 7 * 24 : 1) * 3600 * 1000) return c.ok ? c : null;
    } catch {}
    let out = { at: Date.now(), ok: false };
    try {
      const res = await fetch(`https://www.omdbapi.com/?i=${encodeURIComponent(imdbId)}&apikey=${OMDB_KEY}`);
      const d = await res.json();
      if (d && d.Response === 'True') {
        const clean = v => (v && v !== 'N/A') ? v : null;
        const rt = (d.Ratings || []).find(x => x.Source === 'Rotten Tomatoes');
        out = { at: Date.now(), ok: true, imdb: clean(d.imdbRating), rt: rt ? clean(rt.Value) : null, mc: clean(d.Metascore) };
      }
    } catch {}
    try { localStorage.setItem(key, JSON.stringify(out)); } catch {}
    return out.ok ? out : null;
  }

  function fmtRuntime(mins) {
    if (!(mins > 0)) return '';
    const h = Math.floor(mins / 60), m = mins % 60;
    return h ? `${h}h${m ? ' ' + m + 'm' : ''}` : `${m}m`;
  }


  // ── Cast and actor pages ──
  function makePersonTile(c, role) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile person';
    b.innerHTML = (c.profile_path
        ? `<img class="tile-poster" loading="lazy" src="${IMG}w185${esc(c.profile_path)}" alt="">`
        : `<span class="no-art">${esc(c.name)}</span>`) +
      `<span class="tile-title">${esc(c.name)}</span>` +
      (role ? `<span class="tile-role">${esc(role)}</span>` : '');
    b.addEventListener('click', () => openPerson(c.id));
    return b;
  }

  function openPerson(id) {
    detailsStack.push({ person: id });
    return loadPerson(id);
  }

  async function loadPerson(id) {
    const myReq = ++detailsReq;
    detailsShell(true);
    let p;
    try {
      p = await tmdb(`person/${id}`, '&append_to_response=combined_credits');
    } catch {
      if (myReq === detailsReq) detailsMsg("Couldn't load this. Check your connection and try again.");
      return;
    }
    if (myReq !== detailsReq) return;

    const credits = p.combined_credits || {};
    // Their films and shows, most popular first (chat shows, news and awards shows left out)
    const SKIP_TV = [10763, 10767];
    const seenIds = new Set();
    const titles = [...(credits.cast || []), ...((credits.cast || []).length < 5 ? (credits.crew || []) : [])]
      .filter(r => r.poster_path && (r.media_type === 'movie' || r.media_type === 'tv'))
      .filter(r => !(r.media_type === 'tv' && (r.genre_ids || []).some(g => SKIP_TV.includes(g))))
      .filter(r => { const k = r.media_type + r.id; if (seenIds.has(k)) return false; seenIds.add(k); return true; })
      .sort((a, b) => (b.popularity || 0) - (a.popularity || 0))
      .map(r => fromTmdb(r))
      .filter(isOut);
    const films = titles.filter(t => t.isMovie).slice(0, 20);
    const shows = titles.filter(t => !t.isMovie).slice(0, 20);

    const facts = [];
    if (p.known_for_department) facts.push(esc(p.known_for_department === 'Acting' ? 'Actor' : p.known_for_department));
    if (p.birthday) facts.push('Born ' + new Date(p.birthday + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }));
    if (p.place_of_birth) facts.push(esc(p.place_of_birth));

    const body = detailsEl.querySelector('.d-body');
    body.innerHTML = `
      <div class="person-head">
        ${p.profile_path ? `<img class="person-photo" src="${IMG}w185${esc(p.profile_path)}" alt="">` : ''}
        <div style="display:flex;flex-direction:column;gap:.5rem;min-width:0">
          <h2 class="d-title">${esc(p.name || '')}</h2>
          <div class="d-meta">${facts.join(' · ')}</div>
        </div>
      </div>
      ${p.biography ? `<p class="person-bio">${esc(p.biography)}</p><button class="src-btn d-more">More</button>` : ''}`;
    const bio = body.querySelector('.person-bio'), more = body.querySelector('.d-more');
    if (bio && more) {
      // Only offer "More" if the text is actually cut short
      requestAnimationFrame(() => { if (bio.scrollHeight <= bio.clientHeight + 2) more.remove(); });
      more.addEventListener('click', () => {
        const full = bio.classList.toggle('full');
        more.textContent = full ? 'Less' : 'More';
      });
    }
    if (films.length) body.appendChild(makeRow('Films', films));
    if (shows.length) body.appendChild(makeRow('TV shows', shows));
    if (!films.length && !shows.length) body.insertAdjacentHTML('beforeend', '<div class="d-msg">Nothing to show for them yet.</div>');

    const first = body.querySelector('.tile') || body.querySelector('.d-more') || detailsEl.querySelector('.d-close');
    if (isTvLayout()) navFocus(first);
    else try { first.focus({ preventScroll: true }); } catch {}
  }

  function renderDetails(data, id, isMovie, imdbId, myReq) {
    const title = isMovie ? data.title : data.name;
    const year  = ((isMovie ? data.release_date : data.first_air_date) || '').slice(0, 4);
    const it    = { id, isMovie, title, poster: data.poster_path || null, year };
    const seasons = isMovie ? [] : parseSeasons(data);

    const meta = [];
    if (year) meta.push(esc(year));
    meta.push(isMovie ? 'Film' : 'TV series');
    // Ratings: IMDb / Rotten Tomatoes / Metacritic fill in once OMDb answers; until then
    // (or if it can't), TMDB's own ★ rating
    const tmdbStar = data.vote_count > 20 && data.vote_average
      ? `<span class="star">★</span> ${data.vote_average.toFixed(1)}` : '';
    meta.push(`<span class="d-ratings">${tmdbStar}</span>`);
    if (isMovie && data.runtime) meta.push(fmtRuntime(data.runtime));
    if (!isMovie && seasons.length) meta.push(`${seasons.length} season${seasons.length > 1 ? 's' : ''}`);
    const genres = (data.genres || []).slice(0, 3).map(g => esc(g.name)).join(', ');
    if (genres) meta.push(genres);

    const hero = detailsEl.querySelector('.d-hero');
    if (data.backdrop_path) hero.style.backgroundImage = `url("${IMG}w780${data.backdrop_path}")`;

    const releaseDate = (isMovie ? data.release_date : data.first_air_date) || '';
    const notOut = !releaseDate || releaseDate > todayISO();
    const target = notOut ? null : playTarget(isMovie, imdbId, seasons);
    const notOutMsg = !notOut ? '' : releaseDate
      ? `Not out yet: ${isMovie ? 'comes out' : 'starts'} ${new Date(releaseDate + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}.`
      : 'Not out yet: no release date announced.';
    const body = detailsEl.querySelector('.d-body');
    body.innerHTML = `
      <h2 class="d-title">${esc(title)}</h2>
      <div class="d-meta">${meta.join(' · ')}</div>
      ${data.overview ? `<p class="d-overview">${esc(data.overview)}</p>` : ''}
      <div class="d-actions">
        ${target && imdbId ? `<button class="stream-btn d-play">▶ ${esc(target.label)}</button>` : ''}
        <button class="src-btn d-list"></button>
        <span class="d-msg d-actions-msg">${notOut ? esc(notOutMsg) : !imdbId ? "Can't be played: no IMDb ID for this one." : (!isMovie && !seasons.length ? 'No episodes out yet.' : '')}</span>
      </div>
      ${!isMovie && seasons.length ? `
        <div class="section-label">Episodes</div>
        <div class="d-seasons">${seasons.map(s => `<button class="src-btn d-season" data-n="${s.n}">Season ${s.n}</button>`).join('')}</div>
        <div class="d-eps"></div>` : ''}
    `;

    if (imdbId && OMDB_KEY) {
      omdbRatings(imdbId).then(r => {
        const el = body.querySelector('.d-ratings');
        if (!el || myReq !== detailsReq || !r) return;
        const parts = [];
        if (r.imdb) parts.push(`<span class="imdb-badge">IMDb</span> ${esc(r.imdb)}`);
        if (r.rt)   parts.push(`🍅 ${esc(r.rt)}`);
        if (r.mc)   parts.push(`<span class="mc-badge">${esc(r.mc)}</span> Metacritic`);
        if (parts.length) el.innerHTML = parts.join(' · ');
      });
    }

    const playBtn = body.querySelector('.d-play');
    if (playBtn) playBtn.addEventListener('click', () => playFrom(it, imdbId, target.season, target.episode));

    const listBtn = body.querySelector('.d-list');
    const renderListBtn = () => {
      const on = inMyList(isMovie, id);
      listBtn.textContent = on ? '✓ My List' : '+ My List';
      listBtn.classList.toggle('on', on);
    };
    listBtn.addEventListener('click', () => { toggleMyList(it); renderListBtn(); });
    renderListBtn();

    // Episodes, a season at a time
    if (!isMovie && seasons.length) {
      const epsEl = body.querySelector('.d-eps');
      let shownSeason = null;
      const showSeason = async n => {
        shownSeason = n;
        body.querySelectorAll('.d-season').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
        const count = (seasons.find(s => s.n === n) || {}).count || 0;
        epsEl.innerHTML = '<div class="d-msg">Loading episodes…</div>';
        let eps = seasonCache[id + '_' + n];
        if (!eps) {
          try {
            const d = await tmdb(`tv/${id}/season/${n}`);
            eps = seasonCache[id + '_' + n] = d.episodes || [];
          } catch {
            if (shownSeason === n && myReq === detailsReq) epsEl.innerHTML = `<div class="d-msg">Couldn't load the episodes.</div>`;
            return;
          }
        }
        if (shownSeason !== n || myReq !== detailsReq) return;
        const saved = imdbId ? getProgress(imdbId) : null;
        epsEl.innerHTML = '';
        const soon = soonISO();
        eps.filter(e => e.episode_number >= 1 && (e.episode_number <= count || (e.air_date && e.air_date <= soon))).forEach(e => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'ep';
          let bar = '';
          const watched = isWatched(saved, n, e.episode_number);
          if (watched) {
            bar = `<span class="ep-bar"><i style="width:100%"></i></span><span class="ep-tick" title="Watched">✓</span>`;
          } else if (saved && saved.season === n && saved.episode === e.episode_number) {
            const pct = percent(saved);
            if (pct > 0) bar = `<span class="ep-bar"><i style="width:${pct}%"></i></span>`;
          }
          const sub = [watched ? 'Watched' : '', fmtRuntime(e.runtime),
                       e.air_date ? new Date(e.air_date + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '']
                      .filter(Boolean).join(' · ');
          b.innerHTML = `
            <span class="ep-still">${e.still_path ? `<img loading="lazy" src="${IMG}w300${esc(e.still_path)}" alt="">` : ''}${bar}</span>
            <span class="ep-info">
              <span class="ep-name">${e.episode_number}. ${esc(e.name || 'Episode ' + e.episode_number)}</span>
              ${sub ? `<span class="ep-sub">${esc(sub)}</span>` : ''}
              ${e.overview ? `<span class="ep-desc">${esc(e.overview)}</span>` : ''}
            </span>`;
          b.addEventListener('click', () => playFrom(it, imdbId, n, e.episode_number));
          epsEl.appendChild(b);
        });
        if (!epsEl.children.length) epsEl.innerHTML = '<div class="d-msg">No episodes listed for this season.</div>';
      };
      body.querySelectorAll('.d-season').forEach(b => b.addEventListener('click', () => showSeason(+b.dataset.n)));
      showSeason(target && target.season != null ? target.season : seasons[0].n);
    }

    // Cast (tap someone to see what else they've been in)
    const castList = ((isMovie ? data.credits : data.aggregate_credits) || {}).cast || [];
    const cast = castList.filter(c => c.profile_path).slice(0, 15);
    if (cast.length) {
      const sec = makeRow('Cast', []);
      const track = sec.querySelector('.row-track');
      cast.forEach(c => {
        const role = isMovie ? c.character : ((c.roles && c.roles[0] && c.roles[0].character) || '');
        track.appendChild(makePersonTile(c, role));
      });
      body.appendChild(sec);
    }

    // More like this
    const recs = ((data.recommendations && data.recommendations.results) || [])
      .filter(r => r.poster_path)
      .map(r => fromTmdb(r, r.media_type ? r.media_type === 'movie' : isMovie))
      .filter(isOut)
      .slice(0, 15);
    if (recs.length) body.appendChild(makeRow('More like this', recs));

    if (isTvLayout()) navFocus(playBtn || listBtn);
    else try { (playBtn || listBtn).focus({ preventScroll: true }); } catch {}   // keyboard carries on from here
  }

  // Escape (keyboard) closes the show page
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && detailsEl.classList.contains('open') && !whoEl.classList.contains('open')) detailsBack();
  });


  // ── Loading screen: the title's logo, see-through, filling in as the video loads ──
  // The logo (the official title artwork) comes from TMDB and is saved for 30 days. The
  // fill isn't real progress (players don't say how far along they are): it moves on its
  // own, slowing near the end, and completes the moment the player says it's ready.
  const loadCover = document.getElementById('loadCover');
  const lcBg = loadCover.querySelector('.lc-bg');
  const lcImgs = loadCover.querySelectorAll('.lc-logo img');
  const lcTexts = loadCover.querySelectorAll('.lc-text');
  let loadCoverFor = null, loadCoverTimers = [];

  async function titleArt(info) {
    const key = 'vs_art_' + (info.isMovie ? 'm' : 't') + info.tmdbId;
    try {
      const c = JSON.parse(localStorage.getItem(key) || 'null');
      if (c && Date.now() - c.at < 30 * 86400000) return c;
    } catch {}
    const d = await tmdb(`${info.isMovie ? 'movie' : 'tv'}/${info.tmdbId}/images`, '&include_image_language=en,null');
    const byVotes = (a, b) => (b.vote_average || 0) - (a.vote_average || 0);
    const logos = (d.logos || []).filter(l => l.file_path && !/\.svg$/i.test(l.file_path));
    const logo = logos.filter(l => l.iso_639_1 === 'en').sort(byVotes)[0] || logos.sort(byVotes)[0];
    const back = (d.backdrops || []).filter(b => b.file_path).sort(byVotes)[0];
    const art = { at: Date.now(), logo: logo ? logo.file_path : null, backdrop: back ? back.file_path : null };
    try { localStorage.setItem(key, JSON.stringify(art)); } catch {}
    return art;
  }

  function clearLoadTimers() { loadCoverTimers.forEach(clearTimeout); loadCoverTimers = []; }

  function showLoadCover(info, autoplay) {
    clearLoadTimers();
    if (document.getElementById('vs-pip')) { hideLoadCover(true); return; }   // not in the floating window
    loadCoverFor = info;
    loadCover.className = 'load-cover on';
    lcBg.style.backgroundImage = '';
    lcImgs.forEach(i => { i.removeAttribute('src'); i.style.display = 'none'; });
    lcTexts.forEach(t => { t.textContent = info.title || ''; t.style.display = 'none'; });
    void loadCover.offsetWidth;                       // start the fill from empty
    loadCover.classList.add('going');

    // (the fill starts from empty whenever the logo or the title text first appears)
    const restartFill = () => { loadCover.classList.remove('going'); void loadCover.offsetWidth; if (!loadCover.classList.contains('ready')) loadCover.classList.add('going'); };
    const showText = () => {
      if (loadCoverFor !== info || lcImgs[0].style.display !== 'none' || lcTexts[0].style.display !== 'none') return;
      lcTexts.forEach(t => t.style.display = '');
      restartFill();
    };
    titleArt(info).then(art => {
      if (loadCoverFor !== info) return;
      if (art.backdrop) lcBg.style.backgroundImage = `url("${IMG}w780${art.backdrop}")`;
      if (art.logo) {
        const src = `${IMG}w500${art.logo}`;
        lcImgs[0].onload = () => {
          if (loadCoverFor !== info) return;
          lcTexts.forEach(t => t.style.display = 'none');
          lcImgs.forEach(i => i.style.display = '');
          restartFill();
        };
        lcImgs[0].onerror = showText;
        lcImgs.forEach(i => { i.src = src; });
      } else showText();
    }).catch(showText);
    loadCoverTimers.push(setTimeout(showText, 900));  // no logo yet: show the title in big letters

    // When to step aside without being told it's ready:
    //  - the video won't start by itself (it's waiting for you): as soon as the player has loaded
    //  - vidsrc in a browser (it waits for a tap on its own play button): shortly after loading
    //  - anything else: after 25 seconds at most
    const noHelperVidsrc = (info.sourceKey || getSourceKey()) === 'vidsrc' && !(HOOK && hookEnabled());
    playerFrame.addEventListener('load', () => {
      if (loadCoverFor !== info) return;
      if (!autoplay) finishLoadCover();
      else if (noHelperVidsrc) loadCoverTimers.push(setTimeout(finishLoadCover, 1500));
    }, { once: true });
    loadCoverTimers.push(setTimeout(finishLoadCover, 25000));
  }

  // Ready: finish the fill, then fade away
  function finishLoadCover() {
    if (!loadCover.classList.contains('on') || loadCover.classList.contains('ready')) return;
    clearLoadTimers();
    loadCover.classList.add('ready');
    loadCoverTimers.push(setTimeout(() => loadCover.classList.add('done'), 380));
    loadCoverTimers.push(setTimeout(() => hideLoadCover(true), 850));
  }
  function hideLoadCover(now) {
    loadCoverFor = null;
    loadCover.className = 'load-cover';
  }

  // ── Letterboxd watchlist import ──
  // Letterboxd doesn't let other sites read watchlists, but it lets you export your data:
  // letterboxd.com → Settings → Data → Export your data. Pick that zip (or the watchlist.csv
  // inside it) and the films are matched against TMDB and added to this profile's My List.
  // Re-importing only adds new films; films you've taken off My List aren't put back.
  const lbBtn = document.getElementById('lbImport');
  const lbFile = document.getElementById('lbFile');
  const lbStatus = document.getElementById('lbStatus');
  let lbBusy = false;

  function lbSay(text, kind) {
    lbStatus.textContent = text;
    lbStatus.className = 'sync-status' + (kind ? ' ' + kind : '');
  }

  // A spreadsheet (CSV) into rows, minding "quoted, values"
  function parseCsv(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.some(x => x !== '')) rows.push(row);
        row = [];
      } else cell += c;
    }
    row.push(cell);
    if (row.some(x => x !== '')) rows.push(row);
    return rows;
  }

  function loadZipReader() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload = () => window.JSZip ? resolve(window.JSZip) : reject(new Error('zip'));
      s.onerror = () => reject(new Error('zip'));
      document.head.appendChild(s);
    });
  }

  async function lbReadWatchlist(file) {
    if (/\.zip$/i.test(file.name) || file.type === 'application/zip' || file.type === 'application/x-zip-compressed') {
      const JSZip = await loadZipReader();
      const zip = await JSZip.loadAsync(file);
      const entry = Object.values(zip.files).find(f => /(^|\/)watchlist\.csv$/i.test(f.name));
      if (!entry) throw new Error('nowatchlist');
      return entry.async('string');
    }
    return file.text();
  }

  const normTitle = s => (s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g, '');
  async function lbMatch(name, year) {
    const q = encodeURIComponent(name);
    let res = (await tmdb('search/movie', `&query=${q}${year ? '&year=' + year : ''}`)).results || [];
    if (!res.length && year) res = (await tmdb('search/movie', `&query=${q}`)).results || [];
    const sameYear = r => year && (r.release_date || '').startsWith(year);
    const best = res.find(r => normTitle(r.title) === normTitle(name) && sameYear(r))
              || res.find(r => (normTitle(r.title) === normTitle(name) || normTitle(r.original_title) === normTitle(name)))
              || res.find(sameYear)
              || res[0];
    return best ? fromTmdb(best, true) : null;
  }

  async function lbImport(file) {
    if (lbBusy) return;
    lbBusy = true;
    const who = activeProfile().name;
    try {
      lbSay('Reading the file…');
      let text;
      try { text = await lbReadWatchlist(file); }
      catch (e) {
        lbSay(e.message === 'nowatchlist' ? "That zip doesn't have a watchlist in it (watchlist.csv)."
            : e.message === 'zip' ? "Couldn't open the zip. Try picking the watchlist.csv from inside it instead."
            : "Couldn't read that file.", 'err');
        return;
      }
      const rows = parseCsv(text.replace(/^﻿/, ''));
      const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
      const iName = head.indexOf('name'), iYear = head.indexOf('year'), iDate = head.indexOf('date');
      if (iName < 0) { lbSay("That doesn't look like a Letterboxd watchlist (no Name column).", 'err'); return; }
      const films = rows.map(r => ({ name: (r[iName] || '').trim(), year: (r[iYear] || '').trim(), date: (r[iDate] || '').trim() }))
                        .filter(f => f.name);
      if (!films.length) { lbSay('The watchlist is empty.', 'err'); return; }

      // Match each film (four at a time)
      const found = new Array(films.length), missed = [];
      let done = 0, next = 0;
      const worker = async () => {
        while (next < films.length) {
          const i = next++;
          try { found[i] = await lbMatch(films[i].name, films[i].year); } catch { found[i] = null; }
          if (!found[i]) missed.push(films[i].name + (films[i].year ? ` (${films[i].year})` : ''));
          done++;
          if (done % 5 === 0 || done === films.length) lbSay(`Matching films… ${done} of ${films.length}`);
        }
      };
      await Promise.all([worker(), worker(), worker(), worker()]);

      // Add to My List, keeping Letterboxd's order (newest added first)
      const list = getMyList();
      let added = 0, already = 0, removedBefore = 0;
      films.forEach((f, i) => {
        const it = found[i];
        if (!it) return;
        const key = listKey(true, it.id);
        const have = list[key];
        if (have && !have.gone) { already++; return; }
        if (have && have.gone) { removedBefore++; return; }
        const when = Date.parse(f.date) || 0;
        list[key] = { id: it.id, isMovie: true, title: it.title, poster: it.poster || null, year: it.year || '',
                      t: (when || Date.now()) + i, from: 'letterboxd' };
        added++;
      });
      setMyList(list);
      renderMyListRow();
      if (typeof scheduleSync === 'function') scheduleSync(1000);

      const bits = [`Added ${added} film${added === 1 ? '' : 's'} to ${who}'s My List.`];
      if (already) bits.push(`${already} already there.`);
      if (removedBefore) bits.push(`${removedBefore} skipped (taken off My List before).`);
      if (missed.length) bits.push(`Couldn't find ${missed.length}: ${missed.slice(0, 8).join(', ')}${missed.length > 8 ? '…' : ''}`);
      lbSay(bits.join(' '), added ? 'ok' : '');
    } finally {
      lbBusy = false;
      lbFile.value = '';
    }
  }

  lbBtn.addEventListener('click', () => { if (!lbBusy) lbFile.click(); });
  lbFile.addEventListener('change', () => { if (lbFile.files && lbFile.files[0]) lbImport(lbFile.files[0]); });

  // ── Logo = home ─────────────────────────────────────────────
  // Closes the video (your spot is saved) and clears the search. Same profile.
  const homeLogo = document.getElementById('homeLogo');
  function goHome() {
    if (detailsEl.classList.contains('open')) closeDetails(false);
    if (current) closePlayer();
    queryInput.value = '';
    resultsDiv.innerHTML = '';
    statusDiv.textContent = '';
    document.body.classList.remove('playing');
    renderContinue();
    renderHome();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (isTvLayout()) tvStartFocus();
  }
  homeLogo.addEventListener('click', goHome);
  homeLogo.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); }
  });

  // ── TV remote: move a highlight around with the arrow buttons ──
  // Whatever's highlighted gets pressed with OK. On the video: OK = Skip intro if it's
  // showing, otherwise play / pause; ◀ ▶ = back / forward 10 seconds.
  const tvPanel  = document.getElementById('tvPanel');
  const syncBox  = document.getElementById('syncBox');
  const tvToggle = document.getElementById('tvToggle');
  const NAV_SEL  = 'button, input, select, a[href], [data-nav]';

  function applyTvLayout() {
    const on = isTvLayout();
    document.documentElement.classList.toggle('tv', on);
    document.body.classList.toggle('tv', on);
    if (on && continueDiv.parentNode !== tvPanel) tvPanel.appendChild(continueDiv);
    if (!on && continueDiv.parentNode === tvPanel) syncBox.before(continueDiv);
    // On TV the video area itself can be highlighted
    if (on) { frameWrap.tabIndex = 0; frameWrap.dataset.nav = '1'; }
    else    { frameWrap.removeAttribute('tabindex'); delete frameWrap.dataset.nav; }
    const s = tvSetting();
    tvToggle.textContent = 'TV layout: ' + (s === 'auto' ? `auto (${on ? 'on' : 'off'})` : s);
    if (on) renderContinue();
    fitTvPlayer();
  }
  tvToggle.addEventListener('click', () => {
    const next = { auto: 'on', on: 'off', off: 'auto' }[tvSetting()] || 'auto';
    try { localStorage.setItem('vs_tv', next); } catch {}
    applyTvLayout();
    tvToggle.focus();
  });

  function navVisible(el) {
    if (el.disabled) return false;
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== 'hidden' && cs.display !== 'none';
  }

  // Only what's on top counts: the Who's watching screen, or the fullscreen video
  function navItems() {
    const scope = whoEl.classList.contains('open') ? whoEl
                : detailsEl.classList.contains('open') ? detailsEl
                : (document.fullscreenElement || (frameWrap.classList.contains('tv-full') ? frameWrap : document));
    const items = [...scope.querySelectorAll(NAV_SEL)];
    if (scope !== document && scope.matches && scope.matches(NAV_SEL)) items.unshift(scope);
    return items.filter(el => navVisible(el) && !el.classList.contains('row-btn'));
  }

  // Pressing quickly or holding a button: jump straight there rather than gliding, so
  // one glide doesn't get interrupted by the next (that was the jitter)
  let lastNavAt = 0;
  function navFocus(el) {
    const now = Date.now(), quick = now - lastNavAt < 350;
    lastNavAt = now;
    const how = quick ? 'auto' : 'smooth';
    try { el.focus({ preventScroll: true }); } catch { el.focus(); }
    const r = el.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 50) el.scrollIntoView({ block: 'center', behavior: how });
    // In a row of posters: slide the row along so the highlighted one is in view. Worked
    // out from where the row is heading (not where it is mid-glide), so it never overshoots.
    const track = el.closest && el.closest('.row-track');
    if (track) {
      const tr = track.getBoundingClientRect();
      const left = r.left - tr.left + track.scrollLeft, right = left + r.width;   // place in the row
      const gliding = track._goal != null && now - track._goalAt < 600;
      const view = gliding ? track._goal : track.scrollLeft;
      let goal = null;
      if (left < view + 4) goal = left - 40;
      else if (right > view + track.clientWidth - 4) goal = right - track.clientWidth + 40;
      if (goal != null) {
        goal = Math.max(0, Math.min(goal, track.scrollWidth - track.clientWidth));
        track._goal = goal; track._goalAt = now;
        track.scrollTo({ left: goal, behavior: how });
      }
    }
  }

  // Nearest thing in that direction (straight lines win over diagonals)
  function navMove(dir) {
    const items = navItems();
    const cur = document.activeElement;
    if (!cur || cur === document.body || !items.includes(cur)) {
      const first = items.find(el => el === frameWrap) || items[0];
      if (first) { navFocus(first); return true; }
      return false;
    }
    const a = cur.getBoundingClientRect();
    const acx = a.left + a.width / 2, acy = a.top + a.height / 2;
    const gap = (a1, a2, b1, b2) => Math.max(0, b1 - a2, a1 - b2);
    // ▲ ▼ stay on their own side (main page or the TV side panel); ◀ ▶ cross between them
    const side = el => !!(el.closest && el.closest('#tvPanel'));
    const curSide = side(cur);
    // Rows of posters: ◀ ▶ keep to the row you're on (until it ends), and posters
    // scrolled out of sight in other rows don't count
    const trackOf = el => el.closest && el.closest('.row-track');
    const curTrack = trackOf(cur);
    const inSight = el => {
      const t = trackOf(el);
      if (!t || t === curTrack) return true;
      const r = el.getBoundingClientRect(), tr = t.getBoundingClientRect();
      return r.left >= tr.left - 2 && r.right <= tr.right + 2;
    };
    const horizontal = dir === 'left' || dir === 'right';
    const rowHasMore = curTrack && horizontal && items.some(el => el !== cur && trackOf(el) === curTrack && (() => {
      const r = el.getBoundingClientRect(), c = cur.getBoundingClientRect();
      return dir === 'right' ? r.left >= c.right - 4 : r.right <= c.left + 4;
    })());
    let best = null, bestScore = Infinity;
    const cands = [];
    for (const el of items) {
      if (el === cur) continue;
      if ((dir === 'up' || dir === 'down') && side(el) !== curSide) continue;
      if (!inSight(el)) continue;
      if (rowHasMore && trackOf(el) !== curTrack) continue;
      const b = el.getBoundingClientRect();
      const bcx = b.left + b.width / 2, bcy = b.top + b.height / 2;
      let along, cross, off;
      if (dir === 'down')  { if (bcy <= acy + 1) continue; along = Math.max(0, b.top - a.bottom); }
      if (dir === 'up')    { if (bcy >= acy - 1) continue; along = Math.max(0, a.top - b.bottom); }
      if (dir === 'right') { if (b.left < a.right - 4) continue; along = b.left - a.right; }
      if (dir === 'left')  { if (b.right > a.left + 4) continue; along = a.left - b.right; }
      if (dir === 'up' || dir === 'down') { cross = gap(a.left, a.right, b.left, b.right); off = Math.abs(bcx - acx); }
      else {
        cross = gap(a.top, a.bottom, b.top, b.bottom); off = Math.abs(bcy - acy);
        // ◀ ▶ only go to things on the same line (except across into the TV side panel)
        if (cross > 0 && side(el) === curSide) continue;
      }
      cands.push({ el, along, score: along + cross * 3 + off * 0.1, near: cross * 3 + off * 0.1 });
    }
    // ▲ ▼: go to the very next line first, then the closest thing on it
    if (!horizontal && cands.length) {
      const nextLine = Math.min(...cands.map(c => c.along)) + 24;
      cands.filter(c => c.along <= nextLine).forEach(c => { if (c.near < bestScore) { bestScore = c.near; best = c.el; } });
    } else {
      cands.forEach(c => { if (c.score < bestScore) { bestScore = c.score; best = c.el; } });
    }
    if (best) { navFocus(best); return true; }
    return false;
  }

  // "+10s" / "−10s" bubble (adds up if you keep pressing)
  const jumpBubble = document.getElementById('jumpBubble');
  let jumpTotal = 0, jumpTimer = null;
  function showJump(secs) {
    if (jumpTimer && Math.sign(secs) !== Math.sign(jumpTotal)) jumpTotal = 0;
    jumpTotal += secs;
    jumpBubble.textContent = (jumpTotal > 0 ? '+' : '−') + Math.abs(jumpTotal) + 's';
    jumpBubble.className = 'jump-bubble show ' + (jumpTotal > 0 ? 'right' : 'left');
    clearTimeout(jumpTimer);
    jumpTimer = setTimeout(() => { jumpBubble.classList.remove('show'); jumpTotal = 0; jumpTimer = null; }, 800);
  }

  // Back / forward a few seconds (double-tap on the phone, ◀ ▶ on the TV remote)
  function jumpBy(secs) {
    if (!current) return false;
    const src = SOURCES[current.sourceKey || getSourceKey()];
    if (!canControl(src)) return false;
    window.vsSkipBy(secs);
    showJump(secs);
    return true;
  }

  // Double-tap on the video (phone app):
  //   not fullscreen → go fullscreen (wherever you tap)
  //   fullscreen     → left −10 s · middle pause/play · right +10 s
  let dblFsAt = 0;
  function doubleTap(side) {
    if (!current) return;
    const now = Date.now();
    if (!document.fullscreenElement) {
      if (now - dblFsAt > 700) { dblFsAt = now; toggleFullscreen(); }
      return;
    }
    if (now - dblFsAt < 700) return;      // the last taps of the double-tap that went fullscreen
    if (side === 0) {
      const r = window.vsPlayPause(!isPlaying, false);
      if (r === 'playing' || r === 'paused') {
        jumpBubble.textContent = r === 'playing' ? '▶' : '❚❚';
        jumpBubble.className = 'jump-bubble show center';
        clearTimeout(jumpTimer);
        jumpTimer = setTimeout(() => { jumpBubble.classList.remove('show'); jumpTotal = 0; jumpTimer = null; }, 700);
      }
      return;
    }
    jumpBy(side < 0 ? -10 : 10);
  }

  // OK on the video (TV)
  // ── TV: the player's own buttons (subtitles, settings, speed, quality) ──
  // In fullscreen, ▲ or ▼ hands the remote to the player's buttons (the app's helper puts a
  // white frame on one): arrows move, OK presses, Back finishes. Stops by itself after
  // 30 seconds of not pressing anything, or when you leave fullscreen.
  var playerMenu = false, playerMenuIdle = null, playerMenuWait = null, menuHintTimer = null, menuPressAt = 0;
  // The app can make a real tap on the screen (players ignore made-up clicks)
  const canTap = () => !!(window.vsApp && typeof window.vsApp.postMessage === 'function');
  const menuHint = document.getElementById('menuHint');
  function showMenuHint(text, ms) {
    menuHint.textContent = text;
    menuHint.classList.add('show');
    clearTimeout(menuHintTimer);
    menuHintTimer = setTimeout(() => menuHint.classList.remove('show'), ms || 3500);
  }
  function bumpPlayerMenu() {
    clearTimeout(playerMenuIdle);
    playerMenuIdle = setTimeout(() => endPlayerMenu(), 30000);
  }
  function startPlayerMenu() {
    if (!current || !HOOK || !hookEnabled()) { showMenuHint("The player's buttons only work in the app"); return; }
    playerMenu = true;
    bumpPlayerMenu();
    showMenuHint("Finding the player's buttons…", 2500);
    hookSend('menuStart', { realTap: canTap() });
    clearTimeout(playerMenuWait);
    playerMenuWait = setTimeout(() => {          // nothing answered
      if (!playerMenu) return;
      endPlayerMenu();
      showMenuHint("Couldn't reach this player's buttons. Try another source");
    }, 2500);
  }
  function endPlayerMenu() {
    if (!playerMenu) return;
    playerMenu = false;
    clearTimeout(playerMenuIdle);
    clearTimeout(playerMenuWait);
    hookSend('menuEnd');
    menuHint.classList.remove('show');
  }
  function playerMenuAnswer(state) {
    if (!playerMenu) return;
    clearTimeout(playerMenuWait);
    if (state === 'fullscreen') { endPlayerMenu(); exitAllFullscreen(); return; }   // its own fullscreen button
    if (state === 'scrub') return;
    if (state === 'on') showMenuHint('Player buttons: arrows move · OK presses · Back when done', 5000);
    else { endPlayerMenu(); showMenuHint("This player has no buttons the remote can reach. Try another source"); }
  }

  function tvPlayerOk() {
    if (!current) return;
    if (playerMenu) { bumpPlayerMenu(); menuPressAt = Date.now(); hookSend('menuPress'); return; }
    if (skipBtn.classList.contains('visible')) { skipBtn.click(); return; }
    if (upNextEl.classList.contains('visible')) { goNext(true); return; }
    if (!inAnyFullscreen()) { toggleFullscreen(); return; }       // OK = go fullscreen first
    if (window.vsPlayPause(!isPlaying, false) !== 'none') return;
    if (HOOK && hookEnabled() && !hookReady) { hookSend('start'); return; }   // cover screen: press its play button
    try { playerFrame.focus(); } catch {}                                       // let the player have the remote
  }

  function tvKey(key, e) {
    const dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[key];
    const t = document.activeElement;
    const stop = () => { if (e) { e.preventDefault(); e.stopPropagation(); } };
    if (playerMenu && (key === 'Escape' || key === 'GoBack' || key === 'BrowserBack')) { stop(); endPlayerMenu(); return; }
    if ((key === 'Enter' || key === ' ') && t === frameWrap) { stop(); tvPlayerOk(); return; }
    if (!dir) return;
    if (playerMenu && current) { stop(); bumpPlayerMenu(); youMovedIt(); hookSend('menuMove', { dir }); return; }
    if (t === frameWrap && inAnyFullscreen() && (dir === 'up' || dir === 'down')) { stop(); startPlayerMenu(); return; }
    if (t === frameWrap && (dir === 'left' || dir === 'right')) { stop(); jumpBy(dir === 'left' ? -10 : 10); return; }
    // Typing: ◀ ▶ move along the text until you reach the end of it
    if (t && t.tagName === 'INPUT' && (dir === 'left' || dir === 'right')) {
      const len = t.value.length;
      if (dir === 'left' && !(t.selectionStart === 0 && t.selectionEnd === 0)) return;
      if (dir === 'right' && !(t.selectionStart === len)) return;
    }
    stop();
    if (!navMove(dir) && dir === 'up' && !whoEl.classList.contains('open')) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.addEventListener('keydown', e => {
    if (isTvLayout()) { tvKey(e.key, e); return; }
    // Computer: once a poster, episode or show-page button is selected, the arrow keys
    // move between them (like the TV remote) instead of moving a text cursor
    const dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
    if (!dir || e.altKey || e.ctrlKey || e.metaKey) return;
    let t = document.activeElement;
    const inBrowse = t && t.closest && t.closest('.row-track, .d-eps, .d-seasons, .d-actions, .d-close');
    if (!inBrowse) {
      // Nothing selected yet: ◀ ▶ pick the first poster in view
      if ((dir === 'left' || dir === 'right') && (!t || t === document.body) && !whoEl.classList.contains('open')) {
        const scope = detailsEl.classList.contains('open') ? detailsEl : homeEl;
        const first = [...scope.querySelectorAll('.tile')].find(el => {
          const r = el.getBoundingClientRect();
          return r.width && r.top >= 0 && r.bottom <= innerHeight;
        });
        if (first) { e.preventDefault(); navFocus(first); }
      }
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    navMove(dir);
  }, true);

  // Going in or out of fullscreen on the TV: keep the highlight on the video
  document.addEventListener('fullscreenchange', () => {
    if (!isTvLayout() || !current || !frameWrap.dataset.nav) return;
    setTimeout(() => navFocus(frameWrap), 50);
  });

  // Arrow presses made while the video itself had the remote (the app's helper passes them on,
  // so the player doesn't use them for its own volume)
  function tvKeyFromPlayer(key) {
    if (!isTvLayout()) return;
    if (document.activeElement !== frameWrap) navFocus(frameWrap);
    tvKey(key, null);
  }

  // Where the highlight starts on the TV
  function tvStartFocus() {
    if (!isTvLayout()) return;
    if (whoEl.classList.contains('open')) {
      const tile = whoEl.querySelector('.who-tile.current') || whoEl.querySelector('.who-tile');
      if (tile) navFocus(tile);
      return;
    }
    if (detailsEl.classList.contains('open')) {
      const b = detailsEl.querySelector('.d-play') || detailsEl.querySelector('.d-close');
      if (b) { navFocus(b); return; }
    }
    const first = current ? frameWrap : (continueDiv.querySelector('.stream-btn') || queryInput);
    if (first && first !== queryInput) navFocus(first);
    else { queryInput.blur(); navFocus(searchBtn); }
  }

  // ============================================
  // SYNC BETWEEN DEVICES
  // Type the same profile phrase on each device. The phrase is scrambled (SHA-256)
  // into an address on MantleDB, a free no-sign-up JSON store, where a small note holds
  // your progress. Each device keeps its own copy too, so if the service is down
  // nothing breaks. Merging: for each show, whichever device saved it most recently wins.
  // ============================================
  const SYNC_BASE     = 'https://mantledb.sh/v2/';
  const MAX_SYNCED    = 60;                    // keep the note small
  const REMOVED_KEEP  = 90 * 24 * 3600 * 1000; // remember removals for 90 days
  const syncStatus    = document.getElementById('syncStatus');

  var syncUrl     = null;   // where this profile's note lives
  var syncTimer   = null;
  var syncRunning = false;
  var syncAgain   = false;
  var syncGen     = 0;      // goes up when you switch profile, so a sync for the old one is dropped

  function getProfile() {
    try { return localStorage.getItem('vs_profile') || ''; } catch { return ''; }
  }

  function setStatus(text, kind) {
    syncStatus.textContent = text;
    syncStatus.className = 'sync-status' + (kind ? ' ' + kind : '');
  }

  async function addressFor(profile) {
    const bytes = new TextEncoder().encode('vidsearch:' + profile);
    const hash  = await crypto.subtle.digest('SHA-256', bytes);
    const hex   = [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
    return `${SYNC_BASE}vs-${hex.slice(0, 32)}/progress`;
  }

  // Everything this device knows: { shows: { imdbId: record }, removed: { imdbId: time } }
  function collectLocal() {
    const shows = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith('vs_progress_')) continue;
        try {
          const rec = JSON.parse(localStorage.getItem(key));
          if (rec && rec.title && rec.tmdbId) shows[key.slice(12)] = rec;
        } catch {}
      }
    } catch {}
    return { shows, removed: getRemoved(), list: getMyList() };
  }

  // My List: newest change wins for each title, with one exception: a film that came in
  // from a Letterboxd import never beats you taking it off. Once it's imported, the file
  // has no say: only you (or the + My List button) can put it back.
  // "Taken off" markers are kept for a year and don't count towards the 200-title limit,
  // so a removal can't be pushed out by a long list.
  const LIST_GONE_KEEP = 365 * 24 * 3600 * 1000;
  function mergeLists(a, b) {
    const out = {}, now = Date.now();
    for (const src of [a, b]) {
      for (const [k, r] of Object.entries((src && src.list) || {})) {
        if (!r || !r.t) continue;
        if (r.gone && now - r.t > LIST_GONE_KEEP) continue;
        const have = out[k];
        if (!have) { out[k] = r; continue; }
        if (r.gone && have.from === 'letterboxd') { out[k] = r; continue; }
        if (have.gone && r.from === 'letterboxd') continue;
        if (r.t > have.t) out[k] = r;
      }
    }
    const all = Object.entries(out).sort((x, y) => y[1].t - x[1].t);
    const live = all.filter(([, r]) => !r.gone).slice(0, 200);
    const gone = all.filter(([, r]) => r.gone).slice(0, 400);
    return Object.fromEntries([...live, ...gone]);
  }

  function mergeNotes(a, b) {
    const shows = {}, removed = {}, ticks = {};
    const now = Date.now();
    for (const src of [a, b]) {
      for (const [id, t] of Object.entries((src && src.removed) || {})) {
        if (now - t < REMOVED_KEEP && (!removed[id] || t > removed[id])) removed[id] = t;
      }
      for (const [id, rec] of Object.entries((src && src.shows) || {})) {
        if (!rec || !rec.title) continue;
        if (Array.isArray(rec.w)) (ticks[id] = ticks[id] || new Set()) && rec.w.forEach(k => ticks[id].add(k));
        if (!shows[id] || (rec.t || 0) > (shows[id].t || 0)) shows[id] = rec;
      }
    }
    // Watched ticks from both devices are combined
    for (const [id, set] of Object.entries(ticks)) {
      if (shows[id] && set.size) shows[id] = { ...shows[id], w: [...set].slice(-400) };
    }
    // A removal beats anything saved before it
    for (const id of Object.keys(shows)) {
      if (removed[id] && removed[id] >= (shows[id].t || 0)) delete shows[id];
    }
    // Keep only the most recent shows
    const keep = Object.entries(shows).sort((x, y) => (y[1].t || 0) - (x[1].t || 0)).slice(0, MAX_SYNCED);
    return { v: 1, shows: Object.fromEntries(keep), removed, list: mergeLists(a, b) };
  }
